<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0a0f">
<meta name="description" content="Gitarre lernen nach Gefühl: mit Band, Mikrofon-Erkennung und 3D-Gitarre. Keine Noten.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Riff – Gitarre nach Gefühl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;600;700;800&display=swap">
<style>[hidden] { display: none !important; }
:root {
  --bg: #0b0a0f; --bg2: #13111a; --card: #1a1822; --line: #2a2735; --text: #f6f3f8; --mute: #9b95a8;
  --amber: #ffb547; --good: #4ade80; --c: #ffb547;
  --r: 22px; --pad: 18px;
  --display: 'Bricolage Grotesque', 'Inter', system-ui, sans-serif;
  --body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--body); -webkit-font-smoothing: antialiased; overscroll-behavior: none; touch-action: manipulation; -webkit-text-size-adjust: 100%; }
body { background: radial-gradient(120% 70% at 50% -10%, #2a1d33 0%, #15111c 40%, var(--bg) 75%) fixed; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
h1:focus, h2:focus { outline: none; }
#app { max-width: 560px; margin: 0 auto; min-height: 100%; }
.sr { position: fixed; top: 0; left: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } /* fixed: verlängert die Seite nicht (sonst 1 px Scrollen) */
.screen { min-height: 100vh; min-height: 100dvh; padding: max(16px, env(safe-area-inset-top)) var(--pad) max(20px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; animation: rise .35s ease both; }
.screen.center { align-items: center; justify-content: center; text-align: center; gap: 18px; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
h1 { font-family: var(--display); font-size: clamp(30px, 8vw, 40px); line-height: 1.05; margin: 0; letter-spacing: -0.02em; }
h2 { font-family: var(--display); font-size: 20px; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--mute); margin: 0; font-size: 16px; }
.center { text-align: center; }
.brand { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: -0.04em; }
.brand span { color: var(--amber); }
.brand.big { font-size: 44px; margin-top: 4vh; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 22px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); font-weight: 700; font-size: 16px; transition: transform .12s, background .2s; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--amber); color: #1a1205; border-color: transparent; box-shadow: 0 8px 30px -8px rgba(255,181,71,.6); }
.btn.big { min-height: 62px; font-size: 18px; width: 100%; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--mute); }
.btn.stop { background: #2a2735; }

.btn.danger { color: #fb7185; }
.btn:disabled { opacity: .35; box-shadow: none; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--card); display: grid; place-items: center; }
.toggle { display: inline-flex; align-items: center; gap: 6px; min-height: 52px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--mute); font-weight: 700; }
.toggle.on { color: #1a1205; background: #fb923c; border-color: transparent; }

/* Einstufung */

/* Mikro */
.orb { width: 132px; height: 132px; border-radius: 50%; display: grid; place-items: center; color: var(--amber); background: radial-gradient(circle, rgba(255,181,71,.25), rgba(255,181,71,.04) 70%); box-shadow: 0 0 0 10px rgba(255,181,71,.06), 0 0 0 22px rgba(255,181,71,.03); animation: breathe 2.4s ease-in-out infinite; }
.orb.gold { color: #fbbf24; }
@keyframes breathe { 50% { box-shadow: 0 0 0 16px rgba(255,181,71,.08), 0 0 0 34px rgba(255,181,71,.03); } }

.err { color: #fda4af; background: rgba(251,113,133,.1); padding: 12px 14px; border-radius: 14px; margin: 0; }

/* Stimmgerät */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; }
.strings { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.str { position: relative; border-radius: 16px; border: 1.5px solid var(--line); background: var(--card); padding: 12px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.str i { display: block; width: 80%; background: #caa36a; border-radius: 4px; }
.str b { font-family: var(--display); font-size: 20px; }
.str em { position: absolute; top: -8px; right: -6px; width: 22px; height: 22px; border-radius: 50%; background: var(--good); color: #052e14; display: none; place-items: center; }
.str.on { border-color: var(--amber); background: color-mix(in srgb, var(--amber) 14%, var(--card)); }
.str.pinned { box-shadow: 0 0 0 3px rgba(255,181,71,.35); }
.str.ok em { display: grid; }

.dir { height: 48px; display: grid; place-items: center; }
.dir.ok { color: var(--good); } .dir.off { color: var(--amber); }

/* Start */

.path { display: flex; align-items: center; justify-content: space-between; padding: 6px 4px; }
.path > i { flex: 1; height: 2px; background: var(--line); }
.node { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: var(--bg2); font-weight: 800; font-size: 13px; display: grid; place-items: center; padding: 0; flex: none; }
.node.done { background: var(--c); border-color: var(--c); color: #0b0a0f; }
.node.now { border-color: var(--amber); color: var(--amber); box-shadow: 0 0 0 5px rgba(255,181,71,.18); animation: pulse 1.8s infinite; }
.node.open { border-color: color-mix(in srgb, var(--c) 60%, var(--line)); color: var(--c); }
.node.locked { opacity: .45; cursor: default; }
@keyframes pulse { 50% { box-shadow: 0 0 0 9px rgba(255,181,71,.08); } }

/* Lektion */
.lesson { gap: 10px; }

.tempo { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--mute); background: var(--card); border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 10px; }


.stage { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.tip { display: flex; gap: 10px; align-items: flex-start; margin: 0; color: var(--mute); font-size: 15px; line-height: 1.35; padding: 0 4px; }
.tip svg { flex: none; color: var(--c); }

.count { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 84px; color: var(--amber); pointer-events: none; opacity: 0; text-shadow: 0 0 40px rgba(255,181,71,.5); }

.ring { width: 84px; height: 84px; flex: none; }

@keyframes fill { to { stroke-dashoffset: var(--to); } }
.word { font-family: var(--display); font-size: 28px; margin: 0 0 8px; letter-spacing: -0.02em; }
.beats { display: flex; flex-wrap: wrap; gap: 4px; }
.beats i { width: 10px; height: 10px; border-radius: 50%; }

.beats i.half { border: 2px solid var(--s); }

.hint { display: flex; gap: 8px; align-items: center; margin: 0; font-size: 16px; }
.hint svg { color: var(--c); flex: none; }

@media (min-width: 700px) { .screen { padding-top: 32px; } }
@media (max-height: 700px) { .btn.big { min-height: 54px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* 3D */
.stage3d { position: relative; overflow: hidden; }
.g3d { display: block; width: 100%; height: 100%; touch-action: pan-y; }
.g3d-ov { position: absolute; inset: 0; pointer-events: none; }
.g3d-l { position: absolute; left: 0; top: 0; white-space: nowrap; font-weight: 800; transition: opacity .2s; will-change: transform; }
.g3d-l.fn { color: #0b0a0f; font-size: 12px; margin-top: -1px; }
.g3d-l.x { color: #8d879a; font-size: 16px; }
.g3d-l.pill { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(20,18,26,.88); border: 1px solid rgba(255,255,255,.18); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
.g3d-l.pill.amber { background: var(--amber); color: #1a1205; border-color: transparent; }
.head3d { height: clamp(130px, 21vh, 190px); border-radius: 18px; background: radial-gradient(ellipse at 50% 60%, #241d2c, #120f16 70%); }



.back-abs { position: absolute; top: max(16px, env(safe-area-inset-top)); left: var(--pad); }

/* Takt-Check */

@keyframes beatpop { 0% { transform: scale(1.5); opacity: 1; } 100% { transform: scale(1); opacity: .35; } }

.muted { color: var(--mute); font-weight: 500; }

/* ===================== Riff 2: Hülle, Weg, Üben, Übung, Stimmen ===================== */
#app { max-width: none; }
.page { max-width: 760px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) var(--pad) 110px; display: flex; flex-direction: column; gap: 16px; animation: rise .3s ease both; }
.page.center { align-items: center; text-align: center; justify-content: center; min-height: 100vh; min-height: 100dvh; padding-bottom: 40px; }
.page-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.page-top h1 { font-size: clamp(28px, 6vw, 36px); }
.page-top .sub { margin-top: 6px; }
.tag { font-style: normal; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: color-mix(in srgb, var(--c, #ffb547) 22%, transparent); color: var(--c, #ffb547); }
.tag.soon { background: #2a2735; color: var(--mute); vertical-align: middle; margin-left: 4px; }

/* Hülle + Tabs */
.shell { min-height: 100vh; min-height: 100dvh; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; display: flex; justify-content: space-around; background: rgba(15,13,20,.94); backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 6px 6px max(6px, env(safe-area-inset-bottom)); }
.tabs .brand { display: none; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: 0; color: var(--mute); font-size: 12px; font-weight: 700; padding: 6px 0; border-radius: 14px; }
.tab.on { color: var(--amber); }
.tab svg { flex: none; }
/* Einstellungen sind eine eigene Seite: auf dem Handy ohne Reiter-Leiste, am PC bleibt die Seitenleiste */
.shell.bare .tabs { display: none; }
.shell.bare .page { padding-bottom: 28px; }
@media (min-width: 900px) {
  .shell.bare .tabs { display: flex; }
  .shell { display: grid; grid-template-columns: 230px 1fr; }
  .tabs { position: sticky; top: 0; height: 100vh; height: 100dvh; flex-direction: column; justify-content: flex-start; gap: 6px; border-top: 0; border-right: 1px solid var(--line); padding: 26px 14px; }
  .tabs .brand { display: block; font-size: 30px; padding: 0 12px 18px; }
  .tab { flex: 0 0 auto; flex-direction: row; gap: 12px; font-size: 15px; padding: 12px 14px; justify-content: flex-start; }
  .tab.on { background: rgba(255,181,71,.1); }
  .page { padding-top: 40px; padding-bottom: 60px; }
}

/* Übung */
.ex-wrap { min-height: 100vh; min-height: 100dvh; }
.ex { max-width: 980px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: auto auto auto 1fr auto auto; gap: 12px; padding: max(14px, env(safe-area-inset-top)) var(--pad) max(18px, env(safe-area-inset-bottom)); }
.ex-top { display: flex; align-items: center; gap: 12px; }
.ex-ttl { flex: 1; min-width: 0; }
.ex-ttl h2 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ex-dots { display: flex; gap: 5px; margin-top: 6px; }
.ex-dots i { height: 5px; flex: 1; max-width: 46px; border-radius: 3px; background: #2a2735; }
.ex-dots i.done { background: var(--good); }
.ex-dots i.now { background: var(--amber); }
.hearpill { height: 32px; min-width: 64px; padding: 0 12px; border-radius: 16px; border: 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 700; background: var(--card); color: var(--mute); white-space: nowrap; transition: background .2s, color .2s; }
.hearpill i { width: 8px; height: 8px; border-radius: 4px; background: currentColor; display: block; }
.hearpill.note { background: #13261f; color: var(--good); }
.hearpill.quiet { background: #2e2416; color: var(--amber); }
.hearpill.loud { background: #34161a; color: #ff7a85; }
.hearpill.voice { background: #241c38; color: #b9a3ff; }
.sheet-wrap { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.55); display: grid; place-items: end center; animation: rise .2s; }
.sheet2 { width: 100%; max-width: 560px; box-sizing: border-box; background: var(--card); border-radius: 28px 28px 0 0; padding: 12px var(--pad) max(26px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 16px; }
.sheet2 .grab { align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #3a3546; display: block; }
.meter2 { display: flex; flex-direction: column; gap: 6px; }
.meter2 > span { display: flex; justify-content: space-between; font-size: 15px; }
.meter2 em { font-style: normal; color: var(--mute); font-weight: 700; }
.meter2 > i { display: block; height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.meter2 > i > b { display: block; height: 100%; background: var(--good); transform-origin: left; transform: scaleX(0); transition: transform 80ms linear; }
.meter2 + .meter2 > i > b { background: var(--mute); }
.hs-in { display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 14px; border-radius: 16px; background: #23202d; }
.hs-in option { background: #17151f; }
.hs-in select { flex: 1; background: transparent; color: var(--text); border: 0; font: inherit; font-size: 16px; }
.rec-dot { width: 12px; height: 12px; border-radius: 6px; background: #ff7a85; display: inline-block; }
.ex-stage { height: clamp(190px, 34vh, 330px); border-radius: 22px; background: radial-gradient(ellipse at 50% 55%, #261e2e, #120f16 72%); }
.ex-text { text-align: center; }
.ex-prompt { font-family: var(--display); font-size: clamp(22px, 5vw, 28px); font-weight: 800; margin: 0; letter-spacing: -.01em; }
.ex-why { margin: 6px auto 0; color: var(--mute); font-size: 15px; max-width: 56ch; line-height: 1.4; }
.ex-fb { align-self: start; min-height: 96px; padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; border-radius: 22px; transition: background .2s; }
.ex-fb > b { font-family: var(--display); font-size: 26px; }
.ex-fb > span { color: var(--mute); font-size: 14px; }
.ex-fb.ok { color: var(--good); background: rgba(74,222,128,.08); }
.ex-fb.ok span { color: #a7f3c4; }
.ex-fb.up, .ex-fb.down { color: var(--amber); background: rgba(255,181,71,.07); }
.ex-fb.hear { color: var(--text); }
.ex-fb .big-arrow { font-size: 64px; color: var(--amber); line-height: 1; font-weight: 800; animation: nudge 1s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateX(var(--nx, 6px)); } }
.ex-fb.cards { flex-direction: row; flex-wrap: wrap; gap: 10px; }
.mini-card { display: flex; font-size: 14px !important; gap: 8px; align-items: center; text-align: left; padding: 10px 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-size: 14px; max-width: 300px; }
.mini-card svg { color: var(--amber); flex: none; }
.ex-fb.cards span { color: var(--text); }
.echo-dots { display: flex; gap: 10px; justify-content: center; }
.echo-dots i { width: 38px; height: 38px; border-radius: 50%; border: 2.5px dashed #4a4557; display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 20px; color: var(--amber); }
.echo-dots i.ok { border: 0; background: var(--good); color: #052e14; }
.echo-dots i.up, .echo-dots i.down { border-style: solid; border-color: var(--amber); }
.big-note { font-size: 64px !important; color: var(--amber); }
.ex-ctrl { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice .btn { min-height: 64px; font-size: 18px; }
.choice .btn.hi { border-color: rgba(74,222,128,.4); }
.choice .btn.lo { border-color: rgba(56,189,248,.4); }
.choice .btn.ghost { grid-column: 1 / -1; min-height: 44px; }
.row-ctrl { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
.seg { display: inline-flex; padding: 4px; gap: 4px; border-radius: 999px; background: var(--bg2); border: 1px solid var(--line); }
.seg button { border: 0; background: none; color: var(--mute); font-weight: 700; font-size: 14px; padding: 8px 14px; border-radius: 999px; }
.seg button.on { background: var(--amber); color: #1a1205; }
.seg.wide { display: flex; } .seg.wide button { flex: 1; }
.ex-warn { margin: 0; text-align: center; color: #fde68a; background: rgba(251,191,36,.08); border-radius: 14px; padding: 10px 14px; font-size: 14px; }
@media (min-width: 900px) {
  .ex { grid-template-columns: 1.35fr 1fr; grid-template-rows: auto 1fr auto; column-gap: 28px; align-items: center; }
  .ex-top { grid-column: 1 / -1; }
  .ex-stage { grid-row: 2 / span 3; height: min(62vh, 520px); }
  .ex-text { grid-column: 2; text-align: left; } .ex-why { margin-left: 0; }
  .ex-fb { grid-column: 2; } .ex-ctrl { grid-column: 2; } .ex-warn { grid-column: 1 / -1; }
}

/* Stimmen */

/* Mikro-Freigabe, Abschluss */
.micgate { position: relative; }
.hint-card { display: flex; gap: 10px; align-items: flex-start; text-align: left; max-width: 460px; margin: 0; padding: 12px 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); color: var(--mute); font-size: 14px; }
.hint-card svg { color: var(--amber); flex: none; }
.done2 h1 { font-size: clamp(32px, 7vw, 44px); }
.unlock { display: flex; flex-direction: column; gap: 4px; padding: 14px 18px; border-radius: 18px; background: var(--card); border: 1px dashed #4a4557; max-width: 460px; }
.unlock span { color: var(--mute); font-size: 14px; }
.credits { font-size: 12px; color: var(--mute); margin: 0; }
.page.center .btn.big { max-width: 420px; }

.ex-stage.neck { height: clamp(150px, 24vh, 230px); }
@media (min-width: 900px) { .ex-stage.neck { height: min(46vh, 380px); } }
.ex-fb.cards { flex-direction: column; }
.mini-card b { font-size: 14px; }

.bigmeter { width: min(100%, 320px); margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.bigmeter i { display: block; width: 100%; height: 18px; border-radius: 9px; background: var(--line); overflow: hidden; }
.bigmeter b { display: block; height: 100%; background: linear-gradient(90deg, #4ade80, #ffb547); transform-origin: left; transform: scaleX(0); transition: transform 80ms linear; }
.bigmeter span { font-family: var(--display); font-size: 40px; font-weight: 800; }
.btn.skip { align-self: center; min-height: 44px; font-size: 15px; }
.gameend { gap: 18px; }
.ge-tag { font-size: 14px; font-weight: 800; letter-spacing: .05em; color: #5eead4; }
.ge-stars { display: flex; align-items: flex-end; gap: 8px; }
.ge-score { font-family: var(--display); font-weight: 800; font-size: 72px; line-height: 1; }
.ge-score span { font-size: 38px; color: #6f6880; }
.ge-best { padding: 8px 16px; border-radius: 18px; background: #2e2416; color: var(--amber); font-weight: 700; font-size: 15px; }

/* Übung: Hör-Anzeige als Symbol, kurzer Hinweis mit Knopf, Ansicht-Knöpfe auf der Bühne, Stimmgerät darüber */
.hearpill { gap: 5px; min-width: 44px; padding: 0 11px; }
.hearpill svg { flex: 0 0 auto; }
.hearpill i { display: none; }
.hearpill span { font-family: var(--display); font-size: 15px; }

.ex-warn { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 auto; padding: 8px 8px 8px 14px; border-radius: 22px; background: var(--card); color: var(--mute); font-size: 15px; font-weight: 600; max-width: 100%; }
.ex-warn[data-kind=tune] { background: #2e2416; color: var(--amber); }
.ex-warn[data-kind=loud] { background: #34161a; color: #ff7a85; }
.ex-warn .ew-ic:empty { display: none; }
.btn.mini { min-height: 36px; padding: 0 14px; border-radius: 18px; font-size: 14px; font-weight: 700; background: var(--amber); color: #1a1205; border: 0; }

.ex-stage { position: relative; }
.stage-tools { position: absolute; top: 8px; right: 8px; z-index: 6; display: flex; gap: 6px; }
.st-btn { width: 40px; height: 34px; border-radius: 12px; border: 1px solid var(--line); background: rgba(15,13,20,.72); color: var(--mute); font: inherit; font-size: 13px; font-weight: 800; display: grid; place-items: center; backdrop-filter: blur(6px); }
.st-btn.on { color: var(--amber); border-color: var(--amber); }
.st-btn[hidden] { display: none; }

.tune-overlay { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow: hidden; animation: rise .2s; }

/* Gemeinsame Bausteine der neuen Bildschirme (Einführung, Lernen, Üben, Profil, Einstellungen).
   Name mit „_", damit build.mjs diese Datei vor den Bildschirm-Dateien anhängt. Ruhig: nur weiches Einblenden, nichts springt. */
@keyframes fadein { from { opacity: 0; } }
@keyframes soft { 50% { opacity: .4; } }
.page, .ob, .ex { animation: fadein .35s ease both; }
.view .page { padding-bottom: calc(88px + env(safe-area-inset-bottom)); }
@media (min-width: 900px) { .view .page { padding-bottom: 60px; } }

/* Chips: Serie, Minuten, Lektion */
.chip { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 13px; border-radius: 18px; background: var(--card); font-weight: 700; font-size: 15px; white-space: nowrap; }
.chip svg { flex: none; }
.chip b { font-weight: 700; }
.chip.fl svg, .pf-stat.fl svg { fill: #ff8a3d; stroke: #ff8a3d; }
.chips { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

/* Auswahl-Kärtchen (Gitarre, Hand, Eingang) */
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { position: relative; display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 12px 16px; border-radius: 20px; background: var(--card); border: 2px solid var(--line); color: var(--text); transition: border-color .35s, background .35s; }
.opt-ic { width: 52px; height: 52px; flex: none; border-radius: 16px; background: #23202d; color: var(--mute); display: grid; place-items: center; transition: background .35s, color .35s; }
.opt-t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.opt-t b { font-family: var(--display); font-size: 19px; font-weight: 700; line-height: 1.15; }
.opt-t em { font-style: normal; font-size: 14px; color: var(--mute); line-height: 1.25; }
.opt-ck { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--amber); color: #1a1206; display: grid; place-items: center; opacity: 0; transform: scale(.7); transition: opacity .3s, transform .3s; }
.opt.on { border-color: var(--amber); background: #221b14; }
.opt.on .opt-ic { background: #2e2416; color: var(--amber); }
.opt.on .opt-ck { opacity: 1; transform: none; }
.opts.two { flex-direction: row; }
.opts.two .opt { flex: 1; flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px; }
.opts.two .opt-ck { position: absolute; top: 12px; right: 12px; }
.opts.compact { gap: 8px; }
.opts.compact .opt { padding: 8px 14px; border-radius: 16px; gap: 12px; }
.opts.compact .opt-ic { width: 40px; height: 40px; border-radius: 12px; }
.opts.compact .opt-t b { font-size: 16px; }
.opts.compact .opt-t em { font-size: 13px; }
.flip { display: inline-flex; transform: scaleX(-1); }
@media (max-height: 700px) { .opt { padding: 8px 14px; } .opt-ic { width: 44px; height: 44px; } .opts.two .opt { padding: 10px 14px; gap: 6px; } }

/* Umschalter: Sitzen/Stehen, Stufe, Tagesziel, Hand */
.seg3, .seg2 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 5px; border-radius: 16px; background: var(--card); }
.seg2, .seg3.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.seg3 button, .seg2 button { min-height: 44px; border-radius: 12px; border: 0; background: transparent; color: var(--mute); font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background .3s, color .3s; }
.seg3 button.on, .seg2 button.on { background: #f6f3f8; color: #0e0c13; font-weight: 700; }
.legend { display: flex; gap: 18px; justify-content: center; font-size: 14px; color: var(--mute); }
.legend span { display: flex; align-items: center; gap: 8px; }
.legend i { width: 12px; height: 12px; border-radius: 6px; display: block; }

/* Sterne */
.stars { font-size: 18px; letter-spacing: 2px; white-space: nowrap; }
.stars i { font-style: normal; color: #3a3546; }
.stars i.on { color: var(--amber); }

/* Karte „Kurz stimmen?" und Kapitelliste */
.ov { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.6); display: grid; place-items: end center; animation: fadein .25s ease both; }
.ov.tune-ask { place-items: center; padding: 20px; }
.ask { width: min(100%, 340px); background: #1a1822; border: 1px solid var(--line); border-radius: 24px; padding: 22px 20px 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.ask-ic { width: 56px; height: 56px; border-radius: 50%; background: #2e2416; color: var(--amber); display: grid; place-items: center; }
.ask b { font-family: var(--display); font-size: 22px; }
.ask-btns { display: flex; gap: 10px; width: 100%; }
.ask-btns .btn { flex: 1; padding: 0 12px; }
.sheetx { width: 100%; max-width: 560px; max-height: 88vh; max-height: 88dvh; overflow: auto; background: #17151f; border-radius: 28px 28px 0 0; padding: 16px var(--pad) max(20px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; }
.sheetx header { display: flex; align-items: center; justify-content: space-between; }
.cl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.cl-row { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; padding: 10px 12px; border-radius: 16px; background: var(--card); border: 1.5px solid transparent; color: var(--text); }
.cl-row.now { border-color: color-mix(in srgb, var(--c) 60%, transparent); }
.cl-row.lock { opacity: .5; cursor: default; }
.cl-n { width: 34px; height: 34px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: var(--c); color: #0b0a0f; }
.cl-row.lock .cl-n { background: #2a2735; color: var(--mute); }
.cl-t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.cl-t b { font-size: 16px; }
.cl-t em { font-style: normal; font-size: 13px; color: var(--mute); line-height: 1.3; }
.cl-p { font-size: 13px; font-weight: 700; color: var(--mute); }

/* Geführtes Stimmen vor einer Übung */
.guide-wrap { box-sizing: border-box; max-width: 520px; margin: 0 auto; height: 100vh; height: 100dvh; padding: max(16px, env(safe-area-inset-top)) 22px max(18px, env(safe-area-inset-bottom)); animation: fadein .35s ease both; }

/* Einführung: ein Schritt pro Bildschirm – Zurück + Leiste oben, Bild in der Mitte, ein Knopf unten */
.ob { box-sizing: border-box; max-width: 520px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; gap: 16px; padding: max(14px, env(safe-area-inset-top)) 22px max(18px, env(safe-area-inset-bottom)); }
.ob h1 { font-size: clamp(26px, 8vw, 32px); line-height: 1.08; }
.ob-top { display: flex; align-items: center; gap: 14px; height: 44px; flex: none; }
.ob-back { width: 44px; height: 44px; flex: none; border-radius: 14px; border: 0; background: var(--card); display: grid; place-items: center; }
.ob-bar { flex: 1; height: 8px; border-radius: 4px; background: #2a2735; overflow: hidden; }
.ob-bar b { display: block; height: 100%; border-radius: 4px; background: var(--amber); transition: width .9s cubic-bezier(.3, .7, .2, 1); }
.ob-stage { flex: 0 1 clamp(150px, 30vh, 280px); min-height: 100px; border-radius: 22px; background: radial-gradient(ellipse at 50% 55%, #261e2e, #120f16 72%); }
.ob-stage.fill { flex: 1 1 0; max-height: 460px; }
/* Mitte: Bild + Auswahl zusammen, senkrecht mittig zwischen Überschrift und Knopf */
.ob-mid { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
.ob-grow { flex: 1; }
.ob-head { display: flex; flex-direction: column; gap: 10px; text-align: center; align-items: center; }
.ob-head h1 { font-size: clamp(34px, 10vw, 42px); line-height: 1.02; letter-spacing: -.03em; }
.ob-head .sub { font-size: 17px; line-height: 1.4; max-width: 24ch; }
.ob-welcome { padding-top: max(24px, env(safe-area-inset-top)); }
.ob-welcome .ob-stage { flex: 0 1 clamp(180px, 34vh, 320px); }
.ob-welcome .ob-mid { gap: 22px; }
.ob-welcome .brand.big { margin: 0; font-size: 30px; }
.ob-line { margin: 0; text-align: center; color: var(--mute); font-size: 16px; min-height: 22px; }
.ob-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; min-height: 0; }
.ob-center .sub { max-width: 26ch; }
.ob-center h1 { font-size: clamp(34px, 10vw, 40px); line-height: 1.04; letter-spacing: -.03em; }
.ob-foot { margin-top: auto; display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
.ob-small { margin: 0; text-align: center; color: var(--mute); font-size: 14px; }
.ob-q { text-align: center; font-size: 17px; }
.ob-cta { margin-top: auto; flex: none; }
.ob-foot .ob-cta { margin-top: 0; }
.ob-foot .err { text-align: center; }
.ob .orb { width: 132px; height: 132px; }
.ob .orb.gold { width: 150px; height: 150px; box-shadow: 0 0 60px rgba(255,181,71,.3); animation: none; }
@media (max-height: 700px) { .ob { gap: 12px; } .ob .orb { width: 104px; height: 104px; } .ob .orb.gold { width: 116px; height: 116px; } .ob-center { gap: 12px; } }

/* Schritt 6: das Stimmgerät füllt den Rest */
.ob-tune { height: 100vh; height: 100dvh; }
.ob-tuner { flex: 1; min-height: 0; }
.ob-tuner .tuner3 { height: 100%; }

/* Schritte 7–9 laufen in der Übungs-Laufzeit: dort ersetzt die Leiste Titel und Segmente */
.intro-ex .ex-ttl h2 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.intro-ex .ex-dots { margin-top: 0; gap: 0; height: 8px; border-radius: 4px; overflow: hidden; background: #2a2735; }
.intro-ex .ex-dots i { max-width: none; height: 8px; border-radius: 0; background: transparent; transition: background .6s ease; }
.intro-ex .ex-dots i.done, .intro-ex .ex-dots i.now { background: var(--amber); }
/* Eine Spalte wie bei den anderen Schritten (auch am Rechner); die Bühne bleibt in allen drei Schritten gleich hoch,
   Bühne + Satz + Rückmeldung stehen ruhig in der Mitte, die Punkte unten – nichts springt zwischen den Schritten. */
.intro-ex .ex { display: flex; flex-direction: column; align-items: stretch; max-width: 520px; gap: 12px; }
.intro-ex .ex-top { flex: none; }
.intro-ex .ex-stage, .intro-ex .ex-stage.neck { flex: none; height: clamp(220px, 36vh, 330px); margin-top: auto; }
.intro-ex .ex-text { flex: none; text-align: center; min-height: 64px; }
.intro-ex .ex-why { margin-left: auto; margin-right: auto; }
.intro-ex .ex-fb { flex: none; align-self: stretch; min-height: 96px; padding: 8px 12px; }
.intro-ex .ex-ctrl { flex: none; margin-top: auto; min-height: 108px; align-items: center; justify-content: flex-start; }
.intro-ex .ex-warn { flex: none; }

/* Fortschritt: runde Punkte (Saiten, Melodie) */
.ob-dots { display: flex; gap: 10px; justify-content: center; padding: 4px 0; }
.ob-dots i { box-sizing: border-box; width: 42px; height: 42px; border-radius: 50%; border: 3px solid #2a2735; display: grid; place-items: center; font-style: normal; transition: background .5s ease, border-color .5s ease; }
.ob-dots i.ok { background: var(--good); border-color: var(--good); color: #06200f; }
.ob-dots i.now { border-color: #2dd4bf; animation: soft 2.4s ease-in-out infinite; }
.ob-hear { align-self: center; }

/* Mitspielen: ruhig, groß, ohne Scrollen. Oben Tonart, Mitte die Gitarre, unten Takt + Art. */
.jam { box-sizing: border-box; max-width: 760px; margin: 0 auto; height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: max(16px, env(safe-area-inset-top)) var(--pad) calc(16px + env(safe-area-inset-bottom)); }
.jam-top { display: flex; align-items: center; gap: 10px; }
.jam-top h1 { flex: 1; font-size: clamp(24px, 6vw, 32px); }
.jam-key { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 18px; background: #2e2416; color: var(--amber); font-family: var(--display); font-weight: 800; font-size: 16px; }

.jam-stage { position: relative; flex: 1 1 auto; min-height: 160px; border-radius: 22px; background: radial-gradient(ellipse at 50% 55%, #261e2e, #120f16 72%); overflow: hidden; }
.jam-listen { position: absolute; inset: 0; z-index: 5; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; text-align: center; background: rgba(15, 13, 20, .78); backdrop-filter: blur(3px); }
.jam.listening .jam-listen { display: flex; }
.jam-orb { position: relative; width: 120px; height: 120px; display: grid; place-items: center; color: var(--amber); }
.jam-orb svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.jam-orb circle { fill: none; stroke-width: 6; }
.jo-bg { stroke: #2a2735; }
.jo-fg { stroke: var(--amber); stroke-linecap: round; stroke-dasharray: 0 100; transition: stroke-dasharray .4s; }
.jam-orb > svg:last-child { position: static; width: 44px; height: 44px; transform: none; animation: jamear 1.6s ease-in-out infinite; }
@keyframes jamear { 50% { transform: scale(1.08); } }
.jam-lt { font-family: var(--display); font-size: 24px; }
.jam-ls { color: var(--mute); font-size: 15px; max-width: 320px; }

.jam-beat { display: flex; justify-content: center; gap: 14px; height: 14px; opacity: 0; transition: opacity .4s; }
.jam.beat .jam-beat { opacity: 1; }
.jam-beat i { width: 14px; height: 14px; border-radius: 7px; background: #2a2735; transition: background .08s, transform .08s; }
.jam-beat i:first-child { background: #3a2f1d; }
.jam-beat i.on { background: var(--amber); transform: scale(1.25); box-shadow: 0 0 14px rgba(255, 181, 71, .7); }

.jam-say { margin: 0; min-height: 30px; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--display); font-weight: 800; font-size: 20px; text-align: center; }
.jam.listening .jam-say, .jam.listening .jam-mode { visibility: hidden; }
.jam-mode { display: flex; justify-content: center; gap: 8px; }
.jam-mode button { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 18px; border-radius: 22px; border: 2px solid var(--line); background: var(--card); color: var(--mute); font: inherit; font-weight: 700; font-size: 16px; }
.jam-mode button.on { border-color: var(--amber); color: var(--text); background: #2e2416; }
.jam-foot { display: flex; justify-content: center; }
@media (max-height: 640px) { .jam { gap: 8px; } .jam-orb { width: 90px; height: 90px; } .jam-say { font-size: 17px; min-height: 24px; } }

/* Lernen: Kapitelkopf + geschlungener Weg aus runden Knoten */
.page.learn { gap: 12px; padding-top: max(12px, env(safe-area-inset-top)); min-height: 100vh; min-height: 100dvh; box-sizing: border-box; }
.ln-bar { display: flex; align-items: center; justify-content: space-between; flex: none; }
.ln-ch { flex: none; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 22px; background: color-mix(in srgb, var(--c) 13%, #0e0c13); border: 1px solid color-mix(in srgb, var(--c) 32%, transparent); }
.ln-chi { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.ln-chi small { font-size: 13px; font-weight: 700; letter-spacing: .04em; color: color-mix(in srgb, var(--c) 65%, white); }
.ln-chi h1 { font-size: 22px; letter-spacing: -.01em; line-height: 1.1; }
.ln-prog { height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--c) 25%, #0e0c13); overflow: hidden; }
.ln-prog b { display: block; height: 100%; border-radius: 4px; background: var(--c); transition: width .8s ease; }
.ln-all { width: 46px; height: 46px; flex: none; border-radius: 14px; border: 0; background: color-mix(in srgb, var(--c) 28%, #0e0c13); color: #e7fffa; display: grid; place-items: center; }

/* Weg: Knotengröße passt sich der Höhe an, damit alles auf einen Bildschirm geht */
.ln-path { --n: clamp(44px, calc((100vh - 300px) / 6.6), 72px); --n: clamp(44px, calc((100dvh - 300px) / 6.6), 72px); --dp: calc(var(--n) * .085); list-style: none; margin: 0; padding: 0; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; }
.ln-n { position: relative; display: flex; flex-direction: column; align-items: center; transform: translateX(var(--o)); }
.ln-btn { width: var(--n); height: var(--n); padding: 0; border: 0; border-radius: 50%; display: grid; place-items: center; transition: transform .2s ease; }
.ln-btn:not(:disabled):active { transform: translateY(2px); }
.ln-n.done .ln-btn { background: var(--amber); color: #1a1206; box-shadow: 0 var(--dp) 0 #b9792a; }
.ln-n.lock .ln-btn { background: #1f1c27; color: #5c566b; box-shadow: 0 var(--dp) 0 #15131b; cursor: default; }
.ln-n.cur { margin-top: 40px; }
.ln-n.cur .ln-btn { width: calc(var(--n) * 1.2); height: calc(var(--n) * 1.2); background: var(--c); color: #06201c; box-shadow: 0 0 0 7px color-mix(in srgb, var(--c) 18%, #0e0c13), 0 0 0 10px var(--c), 0 calc(var(--dp) + 2px) 0 10px color-mix(in srgb, var(--c) 55%, black); }
.ln-n.trophy .ln-btn { border-radius: 30%; background: #1f1c27; color: #5c566b; box-shadow: 0 var(--dp) 0 #15131b; }
.ln-n.trophy.got .ln-btn { background: var(--amber); color: #1a1206; box-shadow: 0 var(--dp) 0 #b9792a, 0 0 40px rgba(255,181,71,.35); }
.ln-bub { position: absolute; bottom: calc(100% + 18px); left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 8px 14px; border-radius: 12px; background: #f6f3f8; color: #0e0c13; font-weight: 800; font-size: 14px; }
.ln-bub::after { content: ''; position: absolute; top: 100%; left: 50%; margin-left: -7px; border: 7px solid transparent; border-top-color: #f6f3f8; }
@media (min-width: 900px) { .page.learn { padding-top: 28px; } }

/* Üben: Ton-Jagd (Stufe wählen), Echo, dann zwei gesperrte Karten */
.page.practice { gap: 14px; }
.practice h1 { font-size: 34px; }
.pr-hero { padding: 16px; border-radius: 24px; background: color-mix(in srgb, var(--c) 13%, #0e0c13); border: 2px solid var(--c); display: flex; flex-direction: column; gap: 12px; }
.pr-row, .pr-card { display: flex; align-items: center; gap: 14px; }
.pr-ic { width: 54px; height: 54px; flex: none; border-radius: 16px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--c); }
.pr-hero .pr-ic { background: var(--c); color: #06201c; }
.pr-t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.pr-t b { font-family: var(--display); font-size: 21px; line-height: 1.1; }
.pr-t em { font-style: normal; font-size: 15px; color: var(--mute); }
.pr-hero .pr-t em { color: color-mix(in srgb, var(--c) 45%, white); }
.pr-hero .seg3 { background: color-mix(in srgb, var(--c) 8%, #06100f); padding: 4px; border-radius: 14px; }
.pr-hero .seg3 button { min-height: 40px; font-size: 15px; color: color-mix(in srgb, var(--c) 55%, white); }
.pr-hero .seg3 button.on { background: var(--c); color: #06201c; }
.pr-hero .btn { min-height: 52px; border-radius: 16px; font-size: 17px; }
.pr-card { width: 100%; padding: 14px 18px; border-radius: 22px; background: var(--card); border: 0; color: var(--text); text-align: left; }
.pr-card:not(.soon):hover { background: color-mix(in srgb, var(--c) 10%, var(--card)); }
.pr-card.soon { padding: 10px 16px; background: transparent; border: 1px dashed var(--line); color: #6f6880; cursor: default; }
.pr-card.soon .pr-ic { width: 44px; height: 44px; border-radius: 14px; background: var(--card); color: #6f6880; }
.pr-card.soon .pr-t b { font-size: 18px; color: #8b8499; }
.pr-card.soon .pr-t em { color: #6f6880; font-size: 14px; }
.pr-card.soon .tag.soon { margin: 0; }
@media (max-height: 700px) { .page.practice { gap: 10px; padding-top: max(12px, env(safe-area-inset-top)); } .pr-hero { gap: 10px; padding: 14px; } .pr-card { padding: 12px 16px; } }
/* Mitspielen: die Hauptsache – größer und warm hervorgehoben */
.pr-card.pr-jam { padding: 18px; background: linear-gradient(120deg, #2e2416, var(--card) 70%); border: 1px solid #5a4322; }
.pr-card.pr-jam .pr-ic { color: var(--amber); }
.pr-card.pr-jam .tag.new { margin-left: auto; }

/* Profil + Einstellungen */
.page.profile, .page.settings { gap: 16px; }
.pf-top { display: flex; align-items: center; justify-content: space-between; }
.pf-top h1 { font-size: 32px; }
.pf-top .icon-btn { width: 44px; height: 44px; border-radius: 14px; border: 0; }
.pf-me { display: flex; align-items: center; gap: 16px; }
.pf-av { width: 68px; height: 68px; flex: none; border-radius: 50%; background: #2e2416; color: var(--amber); display: grid; place-items: center; }
.pf-t { display: flex; flex-direction: column; gap: 4px; }
.pf-t b { font-family: var(--display); font-size: 22px; }
.pf-t em { font-style: normal; color: var(--mute); font-size: 15px; }
.pf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pf-stat { display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: 20px; background: var(--card); }
.pf-stat b { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1.1; }
.pf-stat small { font-size: 16px; color: var(--mute); font-weight: 700; }
.pf-stat span { color: var(--mute); font-size: 14px; }
.pf-p { display: block; height: 6px; margin-top: 2px; border-radius: 3px; background: #2a2735; overflow: hidden; }
.pf-p u { display: block; height: 100%; background: var(--c, var(--amber)); text-decoration: none; border-radius: 3px; }
.pf-week { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 20px; background: var(--card); }
.pf-week > b { font-size: 16px; }
.pf-bars { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; height: 90px; }
.pf-bars i { display: block; border-radius: 6px; background: #2a2735; }
.pf-bars i.on { background: var(--amber); }
.pf-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; text-align: center; font-size: 12px; color: var(--mute); }
.pf-days .today { color: var(--text); font-weight: 700; }
@media (max-height: 700px) { .page.profile { gap: 12px; padding-top: max(12px, env(safe-area-inset-top)); } .pf-stat { padding: 12px 16px; } .pf-bars { height: 70px; } .pf-week { padding: 14px 16px; gap: 8px; } }

/* Einstellungen */
.se-top { display: flex; align-items: center; gap: 12px; height: 44px; }
.se-top h1 { font-size: 26px; }
.page.settings { gap: 12px; padding-top: max(14px, env(safe-area-inset-top)); }
.se-sec { display: flex; flex-direction: column; gap: 8px; }
.se-l { font-size: 13px; font-weight: 700; letter-spacing: .04em; color: var(--mute); }
.se-list { border-radius: 18px; background: var(--card); display: flex; flex-direction: column; }
.se-row { box-sizing: border-box; width: 100%; height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--text); font: inherit; font-size: 16px; font-weight: 600; text-align: left; }
.se-row:last-child { border-bottom: 0; }
.se-row em { font-style: normal; color: var(--mute); font-weight: 500; }
.se-row.off span { color: var(--mute); }
.seg3.mini { display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: #0e0c13; }
.seg3.mini button { min-height: 36px; padding: 0 12px; border-radius: 9px; font-size: 14px; }
.se-row svg { color: var(--mute); }
.se-row select { min-width: 0; max-width: 60%; background: transparent; color: var(--mute); border: 0; font: inherit; font-size: 15px; text-align: right; text-overflow: ellipsis; }
.se-row select option { background: #17151f; color: var(--text); }
.se-reset { margin-top: auto; }
.se-del { width: 100%; min-height: 50px; border-radius: 16px; border: 0; background: var(--card); color: #ff7a85; }
.se-del.solid { background: #ff7a85; color: #2a0b0f; }
.ov.dlg { place-items: center; padding: 20px; }
.ask-ic.del { background: #34161a; color: #ff7a85; }
.ask .se-del.solid { min-height: 50px; }
.se-about { display: flex; flex-direction: column; align-items: center; gap: 18px; padding-top: 28px; text-align: center; }
.se-about .brand.big { margin: 0; }
.se-about .credits { max-width: 34ch; font-size: 14px; line-height: 1.55; color: var(--mute); }

/* Stimmgerät – eigene Datei, wird von build.mjs nach styles.css angehängt.
   Ruhig: ein Punkt auf einer Linie, die Mitte ist das Ziel. Oben: welche Saiten schon gestimmt sind. */
.tuner3 { box-sizing: border-box; max-width: 560px; margin: 0 auto; height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: max(16px, env(safe-area-inset-top)) var(--pad) 20px; }
.t3-page { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
.t3-guided { height: 100%; min-height: 0; padding: 0; }
@media (min-width: 900px) { .t3-page { padding-bottom: 24px; } }
.t3-top { display: flex; align-items: center; gap: 12px; }
.t3-top h1 { flex: 1; font-size: clamp(26px, 6vw, 34px); }
.t3-guided .t3-top h1 { font-size: 26px; }

.t3-strings { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.t3-str { position: relative; height: 58px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); color: var(--mute); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; transition: border-color .3s, background .3s, color .3s; }
.t3-str i { display: block; width: 70%; border-radius: 3px; background: #caa36a; }
.t3-str b { font-family: var(--display); font-size: 19px; }
.t3-str em { position: absolute; top: -7px; right: -5px; width: 22px; height: 22px; border-radius: 11px; background: var(--good); color: #052e14; display: none; place-items: center; }
.t3-str.on { border-color: #2dd4bf; background: #0f2a26; color: var(--text); }
.t3-str.ok { border-color: #2f5a3e; background: #13261f; color: var(--good); }
.t3-str.ok em { display: grid; }
.t3-str.ok i { background: var(--good); }

.t3-stage { flex: 1 1 auto; min-height: 110px; max-height: 280px; border-radius: 22px; background: radial-gradient(ellipse at 50% 55%, #261e2e, #120f16 72%); }
.t3-main { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.t3-name { font-family: var(--display); font-weight: 800; font-size: 60px; line-height: 1; min-height: 60px; }

.t3-track { position: relative; width: 100%; max-width: 420px; height: 64px; }
.t3-track::before { content: ''; position: absolute; left: 4%; right: 4%; top: 50%; height: 8px; margin-top: -4px; border-radius: 4px; background: linear-gradient(90deg, #3a2a14, #2a2735 40%, #2a2735 60%, #3a2a14); }
.t3-zone { --p: 0; position: absolute; left: 50%; top: 50%; width: 15%; height: 44px; transform: translate(-50%, -50%); border-radius: 14px; border: 2px solid #2f5a3e; background: linear-gradient(to top, rgba(74,222,128,.55) calc(var(--p) * 100%), transparent 0); transition: border-color .3s; }
.t3-track.in .t3-zone { border-color: var(--good); }
.t3-dot { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; border-radius: 15px; transform: translate(-50%, -50%); background: var(--amber); box-shadow: 0 0 22px rgba(255,181,71,.55); transition: background .3s, opacity .4s, box-shadow .3s, width .2s, height .2s; }
.t3-dot.dim { opacity: .25; }
.t3-dot.edge { animation: t3pulse 1s ease-in-out infinite; }
.t3-dot { --p: 0; }
/* gestimmt: der Punkt füllt sich wie eine Uhr – voll = abgehakt */
.t3-track.in .t3-dot { width: 40px; height: 40px; border-radius: 20px; background: conic-gradient(var(--good) calc(var(--p) * 360deg), rgba(74,222,128,.22) 0); box-shadow: 0 0 22px rgba(74,222,128,.6); }
.t3-track.in .t3-dot::after { content: ''; position: absolute; inset: 9px; border-radius: 50%; background: #0f2a1c; }
/* viel zu tief / viel zu hoch: der Rand der Linie leuchtet */
.t3-track.far-lo::before { background: linear-gradient(90deg, #a8661a, #2a2735 30%, #2a2735 60%, #3a2a14); }
.t3-track.far-hi::before { background: linear-gradient(90deg, #3a2a14, #2a2735 40%, #2a2735 70%, #a8661a); }
.t3-track.far-lo .t3-lo, .t3-track.far-hi .t3-hi { color: var(--amber); }
.t3-track.done .t3-dot { opacity: 0; }
.t3-track.done .t3-zone { border-color: var(--good); background: rgba(74,222,128,.35); }
@keyframes t3pulse { 50% { box-shadow: 0 0 34px rgba(255,181,71,.9); } }
.t3-lo, .t3-hi { position: absolute; bottom: -4px; font-size: 13px; font-weight: 700; color: #6f6880; }
.t3-lo { left: 4%; } .t3-hi { right: 4%; }

.t3-say { margin: 0; min-height: 40px; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--display); font-weight: 800; font-size: 26px; transition: color .3s; }
.t3-say.idle { color: var(--mute); font-size: 20px; font-weight: 700; }
.t3-say.off { color: var(--amber); }
.t3-say.ok { color: var(--good); }
.t3-foot { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.t3-foot .btn.big { width: 100%; max-width: 420px; }
@media (max-height: 700px) { .t3-name { font-size: 44px; min-height: 44px; } .t3-track { height: 52px; } .t3-str { height: 50px; } }
</style>
</head>
