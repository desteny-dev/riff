<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0a0f">
<meta name="description" content="Gitarre lernen nach Gefühl: mit Band, Mikrofon-Erkennung und 3D-Gitarre. Keine Noten.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Riff – Gitarre nach Gefühl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;600;700;800&display=swap">
<style>[hidden] { display: none !important; }
:root {
  --bg: #0b0a0f; --bg2: #13111a; --card: #1a1822; --line: #2a2735; --text: #f6f3f8; --mute: #9b95a8;
  --amber: #ffb547; --good: #4ade80; --c: #ffb547;
  --r: 22px; --pad: 18px;
  --display: 'Bricolage Grotesque', 'Inter', system-ui, sans-serif;
  --body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--body); -webkit-font-smoothing: antialiased; overscroll-behavior: none; touch-action: manipulation; -webkit-text-size-adjust: 100%; }
body { background: radial-gradient(120% 70% at 50% -10%, #2a1d33 0%, #15111c 40%, var(--bg) 75%) fixed; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
h1:focus, h2:focus { outline: none; }
#app { max-width: 560px; margin: 0 auto; min-height: 100%; }
.sr { position: fixed; top: 0; left: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } /* fixed: verlängert die Seite nicht (sonst 1 px Scrollen) */
.screen { min-height: 100vh; min-height: 100dvh; padding: max(16px, env(safe-area-inset-top)) var(--pad) max(20px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
.screen.center { align-items: center; justify-content: center; text-align: center; gap: 18px; }
h1 { font-family: var(--display); font-size: clamp(30px, 8vw, 40px); line-height: 1.05; margin: 0; letter-spacing: -0.02em; }
h2 { font-family: var(--display); font-size: 20px; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--mute); margin: 0; font-size: 16px; }
.center { text-align: center; }
.brand { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: -0.04em; }
.brand span { color: var(--amber); }
.brand.big { font-size: 44px; margin-top: 4vh; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 22px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); font-weight: 700; font-size: 16px; transition: var(--tap); }
.btn.primary { background: var(--amber); color: #1a1205; border-color: transparent; box-shadow: 0 8px 30px -8px rgba(255,181,71,.6); }
.btn.big { min-height: 62px; font-size: 18px; width: 100%; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--mute); }
.btn.stop { background: #2a2735; }

.btn.danger { color: #fb7185; }
.btn:disabled { opacity: .35; box-shadow: none; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--card); display: grid; place-items: center; }
.toggle { display: inline-flex; align-items: center; gap: 6px; min-height: 52px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--mute); font-weight: 700; }
.toggle.on { color: #1a1205; background: #fb923c; border-color: transparent; }

/* Einstufung */

/* Mikro */
.orb { width: 132px; height: 132px; border-radius: 50%; display: grid; place-items: center; color: var(--amber); background: radial-gradient(circle, rgba(255,181,71,.25), rgba(255,181,71,.04) 70%); box-shadow: 0 0 0 10px rgba(255,181,71,.06), 0 0 0 22px rgba(255,181,71,.03); }
.orb.gold { color: #fbbf24; }

.err { color: #fda4af; background: rgba(251,113,133,.1); padding: 12px 14px; border-radius: 14px; margin: 0; }

/* Stimmgerät */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; }
.strings { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.str { position: relative; border-radius: 16px; border: 1.5px solid var(--line); background: var(--card); padding: 12px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.str i { display: block; width: 80%; background: #caa36a; border-radius: 4px; }
.str b { font-family: var(--display); font-size: 20px; }
.str em { position: absolute; top: -8px; right: -6px; width: 22px; height: 22px; border-radius: 50%; background: var(--good); color: #052e14; display: none; place-items: center; }
.str.on { border-color: var(--amber); background: color-mix(in srgb, var(--amber) 14%, var(--card)); }
.str.pinned { box-shadow: 0 0 0 3px rgba(255,181,71,.35); }
.str.ok em { display: grid; }

.dir { height: 48px; display: grid; place-items: center; }
.dir.ok { color: var(--good); } .dir.off { color: var(--amber); }

/* Start */


/* Lektion */
.lesson { gap: 10px; }

.tempo { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--mute); background: var(--card); border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 10px; }


.stage { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.tip { display: flex; gap: 10px; align-items: flex-start; margin: 0; color: var(--mute); font-size: 15px; line-height: 1.35; padding: 0 4px; }
.tip svg { flex: none; color: var(--c); }

.count { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 84px; color: var(--amber); pointer-events: none; opacity: 0; text-shadow: 0 0 40px rgba(255,181,71,.5); }

.ring { width: 84px; height: 84px; flex: none; }

@keyframes fill { to { stroke-dashoffset: var(--to); } }
.word { font-family: var(--display); font-size: 28px; margin: 0 0 8px; letter-spacing: -0.02em; }
.beats { display: flex; flex-wrap: wrap; gap: 4px; }
.beats i { width: 10px; height: 10px; border-radius: 50%; }

.beats i.half { border: 2px solid var(--s); }

.hint { display: flex; gap: 8px; align-items: center; margin: 0; font-size: 16px; }
.hint svg { color: var(--c); flex: none; }

@media (min-width: 700px) { .screen { padding-top: 32px; } }
@media (max-height: 700px) { .btn.big { min-height: 54px; } }

/* 3D */
.stage3d { position: relative; overflow: hidden; }
.g3d { display: block; width: 100%; height: 100%; touch-action: pan-y; }
.g3d-ov { position: absolute; inset: 0; pointer-events: none; }
.g3d-l { position: absolute; left: 0; top: 0; white-space: nowrap; font-weight: 800; transition: opacity var(--t-state) var(--ease-out); will-change: transform; }
.g3d-l.fn { color: #0b0a0f; font-size: 12px; margin-top: -1px; }
.g3d-l.x { color: #8d879a; font-size: 16px; }
.g3d-l.pill { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(20,18,26,.88); border: 1px solid rgba(255,255,255,.18); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
.g3d-l.pill.amber { background: var(--amber); color: #1a1205; border-color: transparent; }
.head3d { height: clamp(130px, 21vh, 190px); border-radius: 18px; background: radial-gradient(ellipse at 50% 60%, #241d2c, #120f16 70%); }



.back-abs { position: absolute; top: max(16px, env(safe-area-inset-top)); left: var(--pad); }

/* Takt-Check */

@keyframes beatpop { 0% { transform: scale(1.5); opacity: 1; } 100% { transform: scale(1); opacity: .35; } }

.muted { color: var(--mute); font-weight: 500; }

/* ===================== Riff 2: Hülle, Weg, Üben, Übung, Stimmen ===================== */
#app { max-width: none; }
.page { max-width: 760px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) var(--pad) 110px; display: flex; flex-direction: column; gap: 16px; }
.page.center { align-items: center; text-align: center; justify-content: center; min-height: 100vh; min-height: 100dvh; padding-bottom: 40px; }
.page-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.page-top h1 { font-size: clamp(28px, 6vw, 36px); }
.page-top .sub { margin-top: 6px; }
.tag { font-style: normal; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: color-mix(in srgb, var(--c, #ffb547) 22%, transparent); color: var(--c, #ffb547); }
.tag.soon { background: #2a2735; color: var(--mute); vertical-align: middle; margin-left: 4px; }

/* Hülle + Tabs */
.shell { min-height: 100vh; min-height: 100dvh; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; display: flex; justify-content: space-around; background: rgba(15,13,20,.94); backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 6px 6px max(6px, env(safe-area-inset-bottom)); }
.tabs .brand { display: none; }
/* Reiter: zwei Ebenen übereinander (grau / amber), der aktive blendet per Opacity um – die Leiste bleibt beim Reiterwechsel stehen */
.tab { position: relative; flex: 1; display: grid; place-items: center; background: none; border: 0; color: var(--mute); font-size: 12px; font-weight: 700; padding: 6px 0; border-radius: 14px; }
.tab::before { content: ''; position: absolute; inset: 0; border-radius: 14px; background: rgba(255,181,71,.1); opacity: 0; transition: opacity var(--t-state) var(--ease-out); display: none; }
.tb { grid-area: 1 / 1; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: opacity var(--t-state) var(--ease-out); }
.tb.hot { color: var(--amber); opacity: 0; }
.tab.on .tb.hot { opacity: 1; }
.tab.on .tb:not(.hot) { opacity: 0; }
.tab svg { flex: none; }
/* Einstellungen sind eine eigene Seite: auf dem Handy ohne Reiter-Leiste, am PC bleibt die Seitenleiste */
.shell.bare .tabs { display: none; }
.shell.bare .page { padding-bottom: 28px; }
@media (min-width: 900px) {
  .shell.bare .tabs { display: flex; }
  .shell { display: grid; grid-template-columns: 230px 1fr; }
  .tabs { position: sticky; top: 0; height: 100vh; height: 100dvh; flex-direction: column; justify-content: flex-start; gap: 6px; border-top: 0; border-right: 1px solid var(--line); padding: 26px 14px; }
  .tabs .brand { display: block; font-size: 30px; padding: 0 12px 18px; }
  .tab { flex: 0 0 auto; font-size: 15px; padding: 12px 14px; place-items: center start; }
  .tab::before { display: block; }
  .tab.on::before { opacity: 1; }
  .tb { flex-direction: row; gap: 12px; }
  .page { padding-top: 40px; padding-bottom: 60px; }
}

/* Übung */
.ex-wrap { min-height: 100vh; min-height: 100dvh; }
.ex { max-width: 980px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: auto auto auto 1fr auto auto; gap: 12px; padding: max(14px, env(safe-area-inset-top)) var(--pad) max(18px, env(safe-area-inset-bottom)); }
.ex-top { display: flex; align-items: center; gap: 12px; }
.ex-ttl { flex: 1; min-width: 0; }
.ex-ttl h2 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ex-dots { display: flex; gap: 5px; margin-top: 6px; }
.ex-dots i { height: 5px; flex: 1; max-width: 46px; border-radius: 3px; background: #2a2735; }
.ex-dots i.done { background: var(--good); }
.ex-dots i.now { background: var(--amber); }
.hearpill { height: 32px; min-width: 64px; padding: 0 12px; border-radius: 16px; border: 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 700; background: var(--card); color: var(--mute); white-space: nowrap; transition: var(--tap), background var(--t-state) var(--ease-out), color var(--t-state) var(--ease-out); }
.hearpill i { width: 8px; height: 8px; border-radius: 4px; background: currentColor; display: block; }
.hearpill.note { background: #13261f; color: var(--good); }
.hearpill.quiet { background: #2e2416; color: var(--amber); }
.hearpill.loud { background: #34161a; color: #ff7a85; }
.hearpill.voice { background: #241c38; color: #b9a3ff; }
.sheet-wrap { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.55); display: grid; place-items: end center; }
.sheet2 { width: 100%; max-width: 560px; box-sizing: border-box; background: var(--card); border-radius: 28px 28px 0 0; padding: 12px var(--pad) max(26px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 16px; }
.sheet2 .grab { align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #3a3546; display: block; }
.meter2 { display: flex; flex-direction: column; gap: 6px; }
.meter2 > span { display: flex; justify-content: space-between; font-size: 15px; }
.meter2 em { font-style: normal; color: var(--mute); font-weight: 700; }
.meter2 > i { display: block; height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.meter2 > i > b { display: block; height: 100%; background: var(--good); transform-origin: left; transform: scaleX(0); transition: transform 80ms linear; }
.meter2 + .meter2 > i > b { background: var(--mute); }
.hs-in { display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 14px; border-radius: 16px; background: #23202d; }
.hs-in option { background: #17151f; }
.hs-in select { flex: 1; background: transparent; color: var(--text); border: 0; font: inherit; font-size: 16px; }
.rec-dot { width: 12px; height: 12px; border-radius: 6px; background: #ff7a85; display: inline-block; }
.ex-stage { height: clamp(190px, 34vh, 330px); border-radius: 22px; background: radial-gradient(ellipse at 50% 55%, #261e2e, #120f16 72%); }
.ex-text { text-align: center; }
.ex-prompt { font-family: var(--display); font-size: clamp(22px, 5vw, 28px); font-weight: 800; margin: 0; letter-spacing: -.01em; }
.ex-why { margin: 6px auto 0; color: var(--mute); font-size: 15px; max-width: 56ch; line-height: 1.4; }
.ex-fb { align-self: start; min-height: 96px; padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; border-radius: 22px; transition: background var(--t-state) var(--ease-out); }
.ex-fb > b { font-family: var(--display); font-size: 26px; }
.ex-fb > span { color: var(--mute); font-size: 14px; }
.ex-fb.ok { color: var(--good); background: rgba(74,222,128,.08); }
.ex-fb.ok span { color: #a7f3c4; }
.ex-fb.up, .ex-fb.down { color: var(--amber); background: rgba(255,181,71,.07); }
.ex-fb.hear { color: var(--text); }
.ex-fb .big-arrow { font-size: 64px; color: var(--amber); line-height: 1; font-weight: 800; animation: nudge 1s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateX(var(--nx, 6px)); } }
.ex-fb.cards { flex-direction: row; flex-wrap: wrap; gap: 10px; }
.mini-card { display: flex; font-size: 14px !important; gap: 8px; align-items: center; text-align: left; padding: 10px 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-size: 14px; max-width: 300px; }
.mini-card svg { color: var(--amber); flex: none; }
.ex-fb.cards span { color: var(--text); }
.echo-dots { display: flex; gap: 10px; justify-content: center; }
.echo-dots i { width: 38px; height: 38px; border-radius: 50%; border: 2.5px dashed #4a4557; display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 20px; color: var(--amber); }
.echo-dots i.ok { border: 0; background: var(--good); color: #052e14; }
.echo-dots i.up, .echo-dots i.down { border-style: solid; border-color: var(--amber); }
.big-note { font-size: 64px !important; color: var(--amber); }
.ex-ctrl { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice .btn { min-height: 64px; font-size: 18px; }
.choice .btn.hi { border-color: rgba(74,222,128,.4); }
.choice .btn.lo { border-color: rgba(56,189,248,.4); }
.choice .btn.ghost { grid-column: 1 / -1; min-height: 44px; }
.row-ctrl { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
.seg { display: inline-flex; padding: 4px; gap: 4px; border-radius: 999px; background: var(--bg2); border: 1px solid var(--line); }
.seg button { border: 0; background: none; color: var(--mute); font-weight: 700; font-size: 14px; padding: 8px 14px; border-radius: 999px; }
.seg button.on { background: var(--amber); color: #1a1205; }
.seg.wide { display: flex; } .seg.wide button { flex: 1; }
.ex-warn { margin: 0; text-align: center; color: #fde68a; background: rgba(251,191,36,.08); border-radius: 14px; padding: 10px 14px; font-size: 14px; }
@media (min-width: 900px) {
  .ex { grid-template-columns: 1.35fr 1fr; grid-template-rows: auto 1fr auto; column-gap: 28px; align-items: center; }
  .ex-top { grid-column: 1 / -1; }
  .ex-stage { grid-row: 2 / span 3; height: min(62vh, 520px); }
  .ex-text { grid-column: 2; text-align: left; } .ex-why { margin-left: 0; }
  .ex-fb { grid-column: 2; } .ex-ctrl { grid-column: 2; } .ex-warn { grid-column: 1 / -1; }
}

/* Stimmen */

/* Mikro-Freigabe, Abschluss */
.micgate { position: relative; }
.hint-card { display: flex; gap: 10px; align-items: flex-start; text-align: left; max-width: 460px; margin: 0; padding: 12px 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); color: var(--mute); font-size: 14px; }
.hint-card svg { color: var(--amber); flex: none; }
.done2 h1 { font-size: clamp(32px, 7vw, 44px); }
.unlock { display: flex; flex-direction: column; gap: 4px; padding: 14px 18px; border-radius: 18px; background: var(--card); border: 1px dashed #4a4557; max-width: 460px; }
.unlock span { color: var(--mute); font-size: 14px; }
.credits { font-size: 12px; color: var(--mute); margin: 0; }
.page.center .btn.big { max-width: 420px; }

.ex-stage.neck { height: clamp(150px, 24vh, 230px); }
@media (min-width: 900px) { .ex-stage.neck { height: min(46vh, 380px); } }
.ex-fb.cards { flex-direction: column; }
.mini-card b { font-size: 14px; }

.bigmeter { width: min(100%, 320px); margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.bigmeter i { display: block; width: 100%; height: 18px; border-radius: 9px; background: var(--line); overflow: hidden; }
.bigmeter b { display: block; height: 100%; background: linear-gradient(90deg, #4ade80, #ffb547); transform-origin: left; transform: scaleX(0); transition: transform 80ms linear; }
.bigmeter span { font-family: var(--display); font-size: 40px; font-weight: 800; }
.btn.skip { align-self: center; min-height: 44px; font-size: 15px; }
.gameend { gap: 18px; }
.ge-tag { font-size: 14px; font-weight: 800; letter-spacing: .05em; color: #5eead4; }
.ge-stars { display: flex; align-items: flex-end; gap: 8px; }
.ge-score { font-family: var(--display); font-weight: 800; font-size: 72px; line-height: 1; }
.ge-score span { font-size: 38px; color: #6f6880; }
.ge-best { padding: 8px 16px; border-radius: 18px; background: #2e2416; color: var(--amber); font-weight: 700; font-size: 15px; }

/* Eine Bewegungssprache für die ganze App – ruhig, genau, ohne Spielerei.
   Alles läuft über diese Zeiten und Kurven (styles.css lädt davor, alle Bildschirm-Dateien danach).
   Bewegt werden nur transform, opacity und stroke-dashoffset – nichts, was das Layout neu rechnet.
   Fortschrittsbalken wachsen mit scaleX (transform-origin links), nie mit width.
   Nichts bewegt sich ohne Grund: die einzige Dauerbewegung ist das ruhige „Du bist hier" am aktuellen Knoten in Lernen. */

:root {
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --ease-inout: cubic-bezier(.65, 0, .35, 1);
  --ease-spring: cubic-bezier(.34, 1.4, .64, 1);   /* kleines Überschwingen – nur für Erfolgsmomente (Haken, abgehakte Saite) */
  --t-tap: 120ms;        /* Antippen */
  --t-state: 240ms;      /* Zustandswechsel, Überblenden */
  --t-enter: 380ms;      /* Bildschirm und Karten erscheinen */
  --t-progress: 700ms;   /* Fortschritt: Balken, Linie, Zahlen */
  --tap: transform var(--t-tap) var(--ease-out);
}

/* ---------- Bausteine ---------- */
@keyframes enter { from { opacity: 0; transform: translateY(8px); } }          /* erscheint: blendet ein, steigt 8 px auf */
@keyframes fade { from { opacity: 0; } }
@keyframes fade-out { to { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: scale(.4); } }                  /* mit --ease-spring: Erfolg */
@keyframes grow-x { from { transform: scaleX(0); } }
@keyframes grow-y { from { transform: scaleY(0); } }
@keyframes here { 50% { transform: scale(1.05); } }                           /* „Du bist hier" */

/* ---------- Bildschirm erscheint ---------- */
/* Der Aufstieg um 8 px darf die Seite nicht scrollbar machen: ein ganzhoher Bildschirm (Lektion, Einführung) ragt beim Einblenden sonst 8 px unten
   über das Fenster hinaus – am Handy ein kurzes Wackeln, am Rechner ein Rollbalken, der 380 ms aufblitzt und alles verschiebt.
   „clip" schneidet nur ab, es macht keinen eigenen Rollbereich (sticky und fixed bleiben wie sie sind). */
#app { overflow: clip; }
.page, .screen, .ob, .ex, .guide-wrap { animation: enter var(--t-enter) var(--ease-out) backwards; }
/* Seite mit gestaffelten Karten: nur sie blendet ein, die Karten steigen selbst auf */
.page.cascade { animation-name: fade; }

/* Karten und Listenpunkte: je 40 ms später, höchstens sechs Stufen */
.stagger > * { animation: enter var(--t-enter) var(--ease-out) backwards; animation-delay: calc((var(--i, 0) + var(--b, 0)) * 40ms); }   /* --b: Vorlauf in Stufen */
.stagger > :nth-child(2) { --i: 1; }
.stagger > :nth-child(3) { --i: 2; }
.stagger > :nth-child(4) { --i: 3; }
.stagger > :nth-child(5) { --i: 4; }
.stagger > :nth-child(n + 6) { --i: 5; }

/* Reiterwechsel: nur überblenden, nichts rutscht. Die alte Seite blendet als Abbild aus (motion.js), die neue ein. */
[data-nav="tab"] .page, [data-nav="tab"] .page.cascade { animation: fade var(--t-state) var(--ease-inout) backwards; }
[data-nav="tab"] .stagger > * { animation: none; }
.xfade { position: fixed; z-index: 7; overflow: hidden; pointer-events: none; animation: fade-out var(--t-state) var(--ease-inout) forwards; }
.xfade *, .xfade *::before, .xfade *::after { animation: none !important; transition: none !important; }

/* Folien und Blätter: der Hintergrund blendet ein, das Blatt steigt auf */
.ov, .sheet-wrap, .tune-overlay { animation: fade var(--t-state) var(--ease-out) backwards; }
.ov > *, .sheet-wrap > * { animation: enter var(--t-enter) var(--ease-out) backwards; }
.ov.leaving { animation: fade-out var(--t-state) var(--ease-out) forwards; pointer-events: none; }
.ov.leaving > * { animation: none; }

/* ---------- Antippen ---------- */
:where(button, [role="button"], summary) { transition: var(--tap); }
button:not(:disabled):active, [role="button"]:not([aria-disabled="true"]):active, summary:active { transform: scale(.97); }
/* Mauszeiger-Effekte stehen nur in @media (hover: hover) – auf dem Handy bleibt sonst der „Hover" nach dem Tippen hängen */

/* ---------- Überblenden von Text (Meldung wechselt, nichts flackert) ---------- */
.xt { display: grid; justify-items: center; align-items: center; }
.xt > * { grid-area: 1 / 1; display: flex; align-items: center; justify-content: center; gap: 8px; max-width: 100%; text-align: center; }
.xt > .xt-in { animation: fade var(--t-state) var(--ease-out) backwards; }
.xt > .xt-out { animation: fade-out var(--t-state) var(--ease-out) forwards; pointer-events: none; }

/* ---------- Haken, der sich zeichnet ---------- */
.tick { --L: 24; }
.tick path { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: var(--L); stroke-dashoffset: var(--L); }
.tick.on path, .on > .tick path { stroke-dashoffset: 0; transition: stroke-dashoffset var(--t-enter) var(--ease-out) 80ms; }
/* zeichnet sich beim Erscheinen von selbst (ohne Klasse): Stand ohne Animation = fertig gezeichnet */
@keyframes draw { from { stroke-dashoffset: var(--L); } }
.tick-draw { --L: 24; }
.tick-draw path { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: var(--L); stroke-dashoffset: 0; animation: draw var(--t-enter) var(--ease-out) 80ms backwards; }

/* ---------- Fortschrittsbalken: wachsen von links (scaleX), Wochenbalken von unten (scaleY) ---------- */
.grow-x { transform-origin: left center; transform: scaleX(var(--f, 1)); animation: grow-x var(--t-progress) var(--ease-out) var(--d, 120ms) backwards; }
.grow-y { transform-origin: center bottom; animation: grow-y var(--t-progress) var(--ease-out) calc(120ms + var(--i, 0) * 40ms) backwards; }

/* ---------- Ruhe: reduzierte Bewegung ----------
   keine Bewegung (kein transform, keine Dauerbewegung), nur Einblenden in höchstens 150 ms; Fortschritt steht sofort auf dem Endstand */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition-property: opacity, color, background-color, border-color !important;
    transition-duration: 150ms !important;
    transition-delay: 0s !important;
    scroll-behavior: auto !important;
  }
  .page, .screen, .ob, .ex, .guide-wrap, .ov, .sheet-wrap, .tune-overlay, .ov > *, .sheet-wrap > *, .stagger > *, .xt > .xt-in, .t3-next:not([hidden]) {
    animation: fade 150ms linear backwards !important;
  }
  .xt > .xt-out, .xfade { display: none !important; }
  .ov.leaving { opacity: 0; }
  button:not(:disabled):active, [role="button"]:active, summary:active { transform: none; opacity: .8; }
  .grow-x { transform: none; width: calc(var(--f, 1) * 100%); }
}

/* Übung: Hör-Anzeige als Symbol, kurzer Hinweis mit Knopf, Ansicht-Knöpfe auf der Bühne, Stimmgerät darüber */
.hearpill { gap: 5px; min-width: 44px; padding: 0 11px; }
.hearpill svg { flex: 0 0 auto; }
.hearpill i { display: none; }
.hearpill span { font-family: var(--display); font-size: 15px; }

.ex-warn { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 auto; padding: 8px 8px 8px 14px; border-radius: 22px; background: var(--card); color: var(--mute); font-size: 15px; font-weight: 600; max-width: 100%; }
.ex-warn[data-kind=tune] { background: #2e2416; color: var(--amber); }
.ex-warn[data-kind=loud] { background: #34161a; color: #ff7a85; }
.ex-warn .ew-ic:empty { display: none; }
.btn.mini { min-height: 36px; padding: 0 14px; border-radius: 18px; font-size: 14px; font-weight: 700; background: var(--amber); color: #1a1205; border: 0; }

/* Bühne je nach Art der Lektion (exercise.js): 'neck' = Gitarre mit Markierungen · 'listen' = Ohr statt Gitarre · 'read' = leer, bis ein Schritt die Gitarre braucht.
   Der Hintergrund der Bühne ist eine eigene Ebene und blendet per Opacity ein und aus. */
.ex-stage { position: relative; isolation: isolate; background: none; }
.ex-stage::before { content: ''; position: absolute; inset: 0; z-index: -1; border-radius: 22px; background: radial-gradient(ellipse at 50% 55%, #261e2e, #120f16 72%); transition: opacity var(--t-state) var(--ease-out); }
.ex-stage[data-kind=listen]::before, .ex-stage[data-kind=read]::before { opacity: 0; }
.ex-stage[data-kind=listen], .ex-stage[data-kind=read] { height: clamp(150px, 24vh, 230px); }
@media (min-width: 900px) { .ex-stage[data-kind=listen], .ex-stage[data-kind=read] { height: min(46vh, 380px); } }
.ex-stage[data-kind=listen] .stage-tools, .ex-stage[data-kind=read] .stage-tools { display: none; }
/* Ohr: nichts zum Anfassen – es zeigt nur, dass die App gerade spielt (sanftes Pulsieren) oder wartet (steht still) */
.ex-calm { position: absolute; inset: 0; display: none; place-items: center; pointer-events: none; }
.ex-stage[data-kind=listen] .ex-calm { display: grid; }
.ex-calm > * { grid-area: 1 / 1; }
.ec-glow { width: 168px; height: 168px; border-radius: 50%; background: radial-gradient(circle, rgba(255,181,71,.2), rgba(255,181,71,0) 68%); opacity: .55; transition: opacity var(--t-state) var(--ease-out); }
.ec-ring { width: 124px; height: 124px; border-radius: 50%; border: 2px solid rgba(255,181,71,.5); opacity: 0; }
.ec-ic { display: grid; color: var(--amber); }
.ex-calm.on .ec-glow { opacity: 1; }
.ex-calm.on .ec-ring { animation: ear-ring 1.6s var(--ease-out) infinite; }
.ex-calm.on .ec-ic { animation: ear-bob 1.6s var(--ease-inout) infinite; }
@keyframes ear-ring { from { transform: scale(.7); opacity: .65; } to { transform: scale(1.3); opacity: 0; } }
@keyframes ear-bob { 50% { transform: scale(1.04); } }
.stage-tools { position: absolute; top: 8px; right: 8px; z-index: 6; display: flex; gap: 6px; }
.st-btn { width: 40px; height: 34px; border-radius: 12px; border: 1px solid var(--line); background: rgba(15,13,20,.72); color: var(--mute); font: inherit; font-size: 13px; font-weight: 800; display: grid; place-items: center; backdrop-filter: blur(6px); }
.st-btn.on { color: var(--amber); border-color: var(--amber); }
.st-btn[hidden] { display: none; }

.tune-overlay { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow: hidden; }

/* Kapitel 3 „Welches Muster?": drei Knöpfe mit Name und Pfeilen; Kapitel 4: Hinweise. Abschlussbildschirm: kleine Notiz. */
.choice.pq { grid-template-columns: repeat(3, 1fr); gap: 8px; }
.choice.pq .btn.pq { flex-direction: column; gap: 4px; min-height: 78px; padding: 8px 2px; font-size: 15px; line-height: 1.15; }
.choice.pq .btn.pq b { font-size: 15px; font-weight: 700; }
.choice.pq .btn.pq .pq-a { font-size: 16px; letter-spacing: 1px; font-weight: 700; white-space: nowrap; color: var(--amber); }
.ge-note { margin: 0; color: var(--mute); font-size: 15px; text-align: center; }

/* Gemeinsame Bausteine der neuen Bildschirme (Einführung, Lernen, Üben, Profil, Einstellungen).
   Name mit „_", damit build.mjs diese Datei vor den Bildschirm-Dateien anhängt. Zeiten, Kurven, Eintritt und Antippen kommen aus ui/motion.css. */
@keyframes soft { 50% { opacity: .4; } }
.view .page { padding-bottom: calc(88px + env(safe-area-inset-bottom)); }
@media (min-width: 900px) { .view .page { padding-bottom: 60px; } }

/* Chips: Serie, Minuten, Lektion */
.chip { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 13px; border-radius: 18px; background: var(--card); font-weight: 700; font-size: 15px; white-space: nowrap; }
.chip svg { flex: none; }
.chip b { font-weight: 700; }
.chip.fl svg, .pf-stat.fl svg { fill: #ff8a3d; stroke: #ff8a3d; }
.chips { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

/* Auswahl-Kärtchen (Gitarre, Hand, Eingang) */
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { position: relative; display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 12px 16px; border-radius: 20px; background: var(--card); border: 2px solid var(--line); color: var(--text); transition: var(--tap), border-color var(--t-state) var(--ease-out), background var(--t-state) var(--ease-out); }
.opt-ic { width: 52px; height: 52px; flex: none; border-radius: 16px; background: #23202d; color: var(--mute); display: grid; place-items: center; transition: background var(--t-state) var(--ease-out), color var(--t-state) var(--ease-out); }
.opt-t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.opt-t b { font-family: var(--display); font-size: 19px; font-weight: 700; line-height: 1.15; }
.opt-t em { font-style: normal; font-size: 14px; color: var(--mute); line-height: 1.25; }
.opt-ck { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--amber); color: #1a1206; display: grid; place-items: center; opacity: 0; transform: scale(.7); transition: opacity var(--t-state) var(--ease-out), transform var(--t-enter) var(--ease-spring); }
.opt.on { border-color: var(--amber); background: #221b14; }
.opt.on .opt-ic { background: #2e2416; color: var(--amber); }
.opt.on .opt-ck { opacity: 1; transform: none; }
.opts.two { flex-direction: row; }
.opts.two .opt { flex: 1; flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px; }
.opts.two .opt-ck { position: absolute; top: 12px; right: 12px; }
.opts.compact { gap: 8px; }
.opts.compact .opt { padding: 8px 14px; border-radius: 16px; gap: 12px; }
.opts.compact .opt-ic { width: 40px; height: 40px; border-radius: 12px; }
.opts.compact .opt-t b { font-size: 16px; }
.opts.compact .opt-t em { font-size: 13px; }
.flip { display: inline-flex; transform: scaleX(-1); }
@media (max-height: 700px) { .opt { padding: 8px 14px; } .opt-ic { width: 44px; height: 44px; } .opts.two .opt { padding: 10px 14px; gap: 6px; } }

/* Umschalter: Sitzen/Stehen, Stufe, Tagesziel, Hand */
.seg3, .seg2 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 5px; border-radius: 16px; background: var(--card); }
.seg2, .seg3.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.seg3 button, .seg2 button { min-height: 44px; border-radius: 12px; border: 0; background: transparent; color: var(--mute); font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: var(--tap), background var(--t-state) var(--ease-out), color var(--t-state) var(--ease-out); }
.seg3 button.on, .seg2 button.on { background: #f6f3f8; color: #0e0c13; font-weight: 700; }
.legend { display: flex; gap: 18px; justify-content: center; font-size: 14px; color: var(--mute); }
.legend span { display: flex; align-items: center; gap: 8px; }
.legend i { width: 12px; height: 12px; border-radius: 6px; display: block; }

/* Sterne */
.stars { font-size: 18px; letter-spacing: 2px; white-space: nowrap; }
.stars i { font-style: normal; color: #3a3546; }
.stars i.on { color: var(--amber); }

/* Karte „Kurz stimmen?" und Kapitelliste */
.ov { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.6); display: grid; place-items: end center; }
.ov.tune-ask { place-items: center; padding: 20px; }
.ask { width: min(100%, 340px); background: #1a1822; border: 1px solid var(--line); border-radius: 24px; padding: 22px 20px 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.ask-ic { width: 56px; height: 56px; border-radius: 50%; background: #2e2416; color: var(--amber); display: grid; place-items: center; }
.ask b { font-family: var(--display); font-size: 22px; }
.ask-btns { display: flex; gap: 10px; width: 100%; }
.ask-btns .btn { flex: 1; padding: 0 12px; }
.sheetx { width: 100%; max-width: 560px; max-height: 88vh; max-height: 88dvh; overflow: auto; background: #17151f; border-radius: 28px 28px 0 0; padding: 16px var(--pad) max(20px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; }
.sheetx header { display: flex; align-items: center; justify-content: space-between; }
.cl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.cl-row { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; padding: 10px 12px; border-radius: 16px; background: var(--card); border: 1.5px solid transparent; color: var(--text); }
.cl-row.now { border-color: color-mix(in srgb, var(--c) 60%, transparent); }
.cl-row.lock { opacity: .5; cursor: default; }
.cl-n { width: 34px; height: 34px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: var(--c); color: #0b0a0f; }
.cl-row.lock .cl-n { background: #2a2735; color: var(--mute); }
.cl-t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.cl-t b { font-size: 16px; }
.cl-t em { font-style: normal; font-size: 13px; color: var(--mute); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } /* das Ziel bleibt eine kurze Zeile */
.cl-bar { display: block; height: 4px; margin-top: 5px; border-radius: 2px; background: color-mix(in srgb, var(--c) 22%, #0e0c13); overflow: hidden; }
.cl-bar u { display: block; height: 100%; background: var(--c); text-decoration: none; }
.cl-p { font-size: 13px; font-weight: 700; color: var(--mute); }

/* Geführtes Stimmen vor einer Übung */
.guide-wrap { box-sizing: border-box; max-width: 520px; margin: 0 auto; height: 100vh; height: 100dvh; padding: max(16px, env(safe-area-inset-top)) 22px max(18px, env(safe-area-inset-bottom)); }

/* Einführung: ein Schritt pro Bildschirm – Zurück + Leiste oben, Bild in der Mitte, ein Knopf unten */
.ob { box-sizing: border-box; max-width: 520px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; gap: 16px; padding: max(14px, env(safe-area-inset-top)) 22px max(18px, env(safe-area-inset-bottom)); }
.ob h1 { font-size: clamp(26px, 8vw, 32px); line-height: 1.08; }
.ob-top { display: flex; align-items: center; gap: 14px; height: 44px; flex: none; }
.ob-back { width: 44px; height: 44px; flex: none; border-radius: 14px; border: 0; background: var(--card); display: grid; place-items: center; }
.ob-bar { flex: 1; height: 8px; border-radius: 4px; background: #2a2735; overflow: hidden; }
.ob-bar b { display: block; height: 100%; border-radius: 4px; background: var(--amber); transition: width .9s cubic-bezier(.3, .7, .2, 1); }
.ob-stage { flex: 0 1 clamp(150px, 30vh, 280px); min-height: 100px; border-radius: 22px; background: radial-gradient(ellipse at 50% 55%, #261e2e, #120f16 72%); }
.ob-stage.fill { flex: 1 1 0; max-height: 460px; }
/* Mitte: Bild + Auswahl zusammen, senkrecht mittig zwischen Überschrift und Knopf */
.ob-mid { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
.ob-grow { flex: 1; }
.ob-head { display: flex; flex-direction: column; gap: 10px; text-align: center; align-items: center; }
.ob-head h1 { font-size: clamp(34px, 10vw, 42px); line-height: 1.02; letter-spacing: -.03em; }
.ob-head .sub { font-size: 17px; line-height: 1.4; max-width: 24ch; }
.ob-welcome { padding-top: max(24px, env(safe-area-inset-top)); }
.ob-welcome .ob-stage { flex: 0 1 clamp(180px, 34vh, 320px); }
.ob-welcome .ob-mid { gap: 22px; }
.ob-welcome .brand.big { margin: 0; font-size: 30px; }
.ob-line { margin: 0; text-align: center; color: var(--mute); font-size: 16px; min-height: 22px; }
.ob-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; min-height: 0; }
.ob-center .sub { max-width: 26ch; }
.ob-center h1 { font-size: clamp(34px, 10vw, 40px); line-height: 1.04; letter-spacing: -.03em; }
.ob-foot { margin-top: auto; display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
.ob-small { margin: 0; text-align: center; color: var(--mute); font-size: 14px; }
.ob-q { text-align: center; font-size: 17px; }
.ob-cta { margin-top: auto; flex: none; }
.ob-foot .ob-cta { margin-top: 0; }
.ob-foot .err { text-align: center; }
.ob .orb { width: 132px; height: 132px; }
.ob .orb.gold { width: 150px; height: 150px; box-shadow: 0 0 60px rgba(255,181,71,.3); animation: none; }
@media (max-height: 700px) { .ob { gap: 12px; } .ob .orb { width: 104px; height: 104px; } .ob .orb.gold { width: 116px; height: 116px; } .ob-center { gap: 12px; } }

/* Schritt 6: das Stimmgerät füllt den Rest */
.ob-tune { height: 100vh; height: 100dvh; }
.ob-tuner { flex: 1; min-height: 0; }
.ob-tuner .tuner3 { height: 100%; }

/* Schritte 7–9 laufen in der Übungs-Laufzeit: dort ersetzt die Leiste Titel und Segmente */
.intro-ex .ex-ttl h2 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.intro-ex .ex-dots { margin-top: 0; gap: 0; height: 8px; border-radius: 4px; overflow: hidden; background: #2a2735; }
.intro-ex .ex-dots i { max-width: none; height: 8px; border-radius: 0; background: transparent; transition: background .6s ease; }
.intro-ex .ex-dots i.done, .intro-ex .ex-dots i.now { background: var(--amber); }
/* Eine Spalte wie bei den anderen Schritten (auch am Rechner); die Bühne bleibt in allen drei Schritten gleich hoch,
   Bühne + Satz + Rückmeldung stehen ruhig in der Mitte, die Punkte unten – nichts springt zwischen den Schritten. */
.intro-ex .ex { display: flex; flex-direction: column; align-items: stretch; max-width: 520px; gap: 12px; }
.intro-ex .ex-top { flex: none; }
.intro-ex .ex-stage, .intro-ex .ex-stage.neck { flex: none; height: clamp(220px, 36vh, 330px); margin-top: auto; }
.intro-ex .ex-text { flex: none; text-align: center; min-height: 64px; }
.intro-ex .ex-why { margin-left: auto; margin-right: auto; }
.intro-ex .ex-fb { flex: none; align-self: stretch; min-height: 96px; padding: 8px 12px; }
.intro-ex .ex-ctrl { flex: none; margin-top: auto; min-height: 108px; align-items: center; justify-content: flex-start; }
.intro-ex .ex-warn { flex: none; }

/* Fortschritt: runde Punkte (Saiten, Melodie) */
.ob-dots { display: flex; gap: 10px; justify-content: center; padding: 4px 0; }
.ob-dots i { box-sizing: border-box; width: 42px; height: 42px; border-radius: 50%; border: 3px solid #2a2735; display: grid; place-items: center; font-style: normal; transition: background .5s ease, border-color .5s ease; }
.ob-dots i.ok { background: var(--good); border-color: var(--good); color: #06200f; }
.ob-dots i.now { border-color: #2dd4bf; animation: soft 2.4s ease-in-out infinite; }
.ob-hear { align-self: center; }
/* Halten: kleiner Hinweis, dass man die Figur drehen kann */
.ob-turn { margin: -6px 0 0; text-align: center; color: #6f6880; font-size: 13px; }
@media (max-width: 380px) { .ob .seg3 button { font-size: 15px; gap: 5px; } }

/* Mitspielen: ruhig, groß, ohne Scrollen. Oben Tonart, Mitte die Gitarre, unten Takt + Art. */
.jam { box-sizing: border-box; max-width: 760px; margin: 0 auto; height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: max(16px, env(safe-area-inset-top)) var(--pad) calc(16px + env(safe-area-inset-bottom)); }
.jam-top { display: flex; align-items: center; gap: 10px; }
.jam-top h1 { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: clamp(21px, 5.6vw, 32px); }
.jam-key { flex: none; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 18px; background: #2e2416; color: var(--amber); font-family: var(--display); font-weight: 800; font-size: 16px; }

.jam-stage { position: relative; flex: 1 1 auto; min-height: 160px; border-radius: 22px; background: radial-gradient(ellipse at 50% 55%, #261e2e, #120f16 72%); overflow: hidden; }

.jam-orb { position: relative; width: 120px; height: 120px; display: grid; place-items: center; color: var(--amber); }
.jam-orb svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }

.jo-bg { stroke: #2a2735; }

.jam-orb > svg:last-child { position: static; width: 44px; height: 44px; transform: none; animation: jamear 1.6s ease-in-out infinite; }
@keyframes jamear { 50% { transform: scale(1.08); } }

.jam-capo { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 6; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 18px; background: rgba(20, 17, 27, .96); border: 1px solid var(--line); box-shadow: 0 8px 30px rgba(0, 0, 0, .5); }

/* Lektion mit Ziel: statt der Wahl Griffe/Frei/Folgen steht dort der Fortschritt (60 s) */
.jam-goal { display: none; align-items: center; gap: 12px; min-height: 44px; }
.jam.goalmode .jam-goal { display: flex; }
.jam.goalmode .jam-mode { display: none; }

.jg-bar b { display: block; height: 100%; width: 0; border-radius: 5px; background: var(--amber); transition: width .5s linear; }
.jg-t { flex: none; min-width: 74px; text-align: right; font-family: var(--display); font-weight: 800; font-size: 17px; color: var(--text); white-space: nowrap; }

/* Lernen: Kapitelkopf + geschlungener Weg aus runden Knoten, verbunden durch eine Linie.
   Bewegung (ui/motion.css): Karten steigen gestaffelt auf, der Weg (Linie und Knoten zusammen) blendet als Ganzes ein, der Kapitelbalken wächst mit scaleX, die Linie füllt sich über stroke-dashoffset,
   Zustände sind Ebenen, die per Opacity überblenden. Dauerbewegung gibt es nur am aktuellen Knoten: ein ruhiges Atmen (2,4 s, 1 → 1,05). */
.page.learn { gap: 12px; padding-top: max(12px, env(safe-area-inset-top)); min-height: 100vh; min-height: 100dvh; box-sizing: border-box; }
.ln-top { display: contents; }
.ln-bar { display: flex; align-items: center; justify-content: space-between; flex: none; }
.ln-ring { animation: ring-in var(--t-progress) var(--ease-out) 160ms backwards; }
@keyframes ring-in { from { stroke-dashoffset: var(--C); } }
.ln-ch { flex: none; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 22px; background: color-mix(in srgb, var(--c) 13%, #0e0c13); border: 1px solid color-mix(in srgb, var(--c) 32%, transparent); }
.ln-chi { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.ln-chi small { font-size: 13px; font-weight: 700; letter-spacing: .04em; color: color-mix(in srgb, var(--c) 65%, white); }
.ln-chi h1 { font-size: 22px; letter-spacing: -.01em; line-height: 1.1; }
.ln-prog { height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--c) 25%, #0e0c13); overflow: hidden; }
.ln-prog b { display: block; height: 100%; background: var(--c); --d: 200ms; transition: transform var(--t-progress) var(--ease-out); }
.ln-prog.pre b { transform: scaleX(var(--f0)); }   /* vor dem Fortschrittsmoment steht der Balken noch auf dem alten Stand */
.ln-all { width: 46px; height: 46px; flex: none; border-radius: 14px; border: 0; background: color-mix(in srgb, var(--c) 28%, #0e0c13); color: #e7fffa; display: grid; place-items: center; }

/* Weg: pathlayout.js rechnet Knotenmitten, Knotengröße (--n) und die Linie; hier steht nur, wie es aussieht.
   Die Fläche füllt den Rest des Bildschirms; mehr Lektionen als hineinpassen (PITCH_MIN je Zeile, --pmin) machen sie höher, dann scrollt die Seite. */
.ln-wrap { position: relative; flex: 1 1 auto; min-height: calc(var(--cnt) * var(--pmin)); animation: enter var(--t-enter) var(--ease-out) 120ms backwards; }
.ln-wrap:not(.laid) .ln-n { visibility: hidden; }
.ln-line { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.ln-t, .ln-f { fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
.ln-t { stroke: #322e3e; }
/* der Fortschritt ist derselbe Pfad: ein Strich über die ganze Länge (pathLength = 1000), der Versatz schiebt ihn bis zum aktuellen Knoten */
.ln-f { stroke: var(--good); stroke-dasharray: 1000; stroke-dashoffset: 1000; transition: stroke-dashoffset var(--t-progress) var(--ease-inout); }
.ln-line.nt .ln-f { transition: none; }
.ln-path { list-style: none; margin: 0; padding: 0; position: absolute; inset: 0; --dp: calc(var(--n, 48px) * .085); }
/* jeder Knoten sitzt mit Nullgröße auf seiner Mitte (left/top aus pathlayout); Knopf, Bild und Maskottchen hängen daran */
.ln-n { position: absolute; width: 0; height: 0; z-index: 1; }
.ln-btn { position: absolute; left: calc(var(--n) / -2); top: calc(var(--n) / -2); display: block; width: var(--n); height: var(--n); padding: 0; border: 0; border-radius: 50%; background: none; color: inherit; }
.ln-n.lock .ln-btn { cursor: default; }
/* undurchsichtiger Grund unter allen Zuständen: die Linie läuft durch die Mitte, darf aber nie durch einen Knoten scheinen */
.ln-disc { position: absolute; inset: 0; border-radius: 50%; background: #0e0c13; }
.ln-d { position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center; opacity: 0; transition: opacity var(--t-state) var(--ease-out); }
.ln-d-lock { border: 2px solid #3a3546; color: #5c566b; }
.ln-d-cur { background: var(--amber); color: #1a1206; box-shadow: 0 0 0 6px rgba(255,181,71,.18), 0 var(--dp) 0 #b9792a; }
.ln-d-done, .ln-d-got { box-shadow: 0 var(--dp) 0 #2c8a52; background: var(--good); color: #06240f; }
.ln-n.lock .ln-d-lock, .ln-n.cur .ln-d-cur, .ln-n.done .ln-d-done, .ln-n.trophy .ln-d-lock, .ln-n.trophy.got .ln-d-got { opacity: 1; }
.ln-n.trophy.got .ln-d-lock { opacity: 0; }
.ln-n.trophy .ln-disc, .ln-n.trophy .ln-d { border-radius: 30%; }
.ln-n.trophy .ln-d-got { background: var(--amber); color: #1a1206; box-shadow: 0 var(--dp) 0 #b9792a, 0 0 40px rgba(255,181,71,.35); }
/* der Haken eines erledigten Knotens zeichnet sich (stroke-dashoffset), wenn der Knoten erledigt wird */
.ln-n.done .ln-d-done .tick path { stroke-dashoffset: 0; transition: stroke-dashoffset var(--t-enter) var(--ease-out) 120ms; }
/* „Du bist hier": das einzige, was endlos läuft – ruhig, 2,4 s, 1 → 1,05 */
.ln-n.cur .ln-disc { animation: here 2.4s var(--ease-inout) infinite; }

/* Bild neben dem Knoten: auf der Seite gegenüber dem Ausschlag; hell bei geschafft und dran, gedämpft bei später (zwei Ebenen, die per Opacity überblenden) */
.ln-art { position: absolute; top: calc(var(--ah) / -2 - 6px); height: calc(var(--ah) + 12px); display: grid; align-items: center; pointer-events: none; }
.ln-n[data-side="r"] .ln-art { right: calc(var(--n) / 2 + 12px); justify-items: end; }
.ln-n[data-side="l"] .ln-art { left: calc(var(--n) / 2 + 12px); justify-items: start; }
.ln-art > span { grid-area: 1 / 1; display: block; line-height: 0; transition: opacity var(--t-state) var(--ease-out); }
.ln-art svg { display: block; height: var(--ah); width: auto; max-width: 110px; }
.ln-art .a-b { opacity: 0; }
.ln-n.cur .a-b, .ln-n.done .a-b { opacity: 1; }
.ln-n.cur .a-m, .ln-n.done .a-m { opacity: 0; }
.ln-n.trophy .ln-art { display: none; }
/* Maskottchen-Platz (leer): neben dem aktuellen Knoten, auf der Seite des Ausschlags – später sitzt hier das Maskottchen */
.ln-mascot { position: absolute; top: -32px; width: 64px; height: 64px; pointer-events: none; }
.ln-n[data-side="r"] .ln-mascot { left: calc(var(--n) / 2 + 8px); }
.ln-n[data-side="l"] .ln-mascot { right: calc(var(--n) / 2 + 8px); }

/* Fortschrittsmoment: das Bild steht kurz auf dem Stand davor (DOM und Klassen zeigen schon den neuen) */
.ln-path.rep .rk .ln-d-cur { opacity: 1; }
.ln-path.rep .rk .ln-d-done { opacity: 0; }
.ln-path.rep .rk .ln-d-done .tick path { stroke-dashoffset: var(--L); transition: none; }
.ln-path.rep .rk1 .ln-d-cur { opacity: 0; }
.ln-path.rep .rk1 .ln-d-lock { opacity: 1; }
.ln-path.rep .rk1 .ln-disc { animation: none; }
.ln-path.rep .rk1 .a-b { opacity: 0; }
.ln-path.rep .rk1 .a-m { opacity: 1; }
@media (min-width: 900px) { .page.learn { padding-top: 28px; } }

/* Üben: Ton-Jagd (Stufe wählen), Echo, dann zwei gesperrte Karten */

/* Mitspielen: die Hauptsache – größer und warm hervorgehoben */

@media (max-height: 700px) { .page.practice { gap: 8px; } .pr-card.pr-jam { padding: 12px 16px; } .pr-ic { width: 46px; height: 46px; border-radius: 14px; } .pr-t b { font-size: 19px; } .pr-t em { font-size: 14px; } .page.practice h1 { font-size: 30px; } }

/* Profil + Einstellungen */

.sp-head { margin: 4px 0 0; font-size: 13px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--mute); }
.sp-list { flex: 1 1 auto; min-height: 120px; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 4px; margin: 0 calc(-1 * var(--pad)); padding: 0 var(--pad); }
.sp-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px; border: 0; border-radius: 14px; background: transparent; color: var(--text); font: inherit; text-align: left; }
.sp-row:focus-visible { background: #2a2534; }
@media (hover: hover) { .sp-row:hover { background: #2a2534; } }
.sp-row img, .sp-noart { flex: 0 0 auto; width: 48px; height: 48px; border-radius: 10px; object-fit: cover; background: #2a2534; display: grid; place-items: center; color: var(--mute); }
.sp-row span { min-width: 0; display: flex; flex-direction: column; }
.sp-row b, .sp-row em { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp-row em { font-style: normal; font-size: 14px; color: var(--mute); }
.sp-msg { margin: 12px 0; color: var(--mute); text-align: center; }
.sp-note { margin: 0; font-size: 12px; color: #6f6880; text-align: center; }

.np { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 8px; border-radius: 18px; background: var(--card); }
.np-art { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 10px; overflow: hidden; background: #2a2534; display: grid; place-items: center; color: var(--mute); }
.np-art img { width: 100%; height: 100%; object-fit: cover; }
.np-t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.np-t b, .np-t em { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-t b { font-size: 15px; }
.np-t em { font-style: normal; font-size: 13px; color: var(--mute); }
.np-btn { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 20px; border: 0; background: #2a2534; color: var(--text); display: grid; place-items: center; }

/* Spur: Liederliste und die endlose Gitarre. Ruhig, groß, ohne Scrollen. */
.sp-page { box-sizing: border-box; max-width: 760px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; gap: 12px; padding: max(14px, env(safe-area-inset-top)) var(--pad) calc(16px + env(safe-area-inset-bottom)); }
.sp-top { display: flex; align-items: center; gap: 14px; height: 44px; flex: none; }
.sp-top h1 { font-size: 26px; }
.sp-menu .seg3, .sp-menu .seg2 { flex: none; }
.sp-tabs button { min-height: 46px; }
.sp-pat[hidden], .sp-click[hidden] { display: none; }
.sp-pat button { flex-direction: column; gap: 2px; min-height: 58px; padding: 6px 4px; font-size: 14px; }
.sp-pat button b { font-size: 14px; font-weight: 700; }
.sp-pat button .pglyph { display: block; width: 66px; height: 22px; max-width: 100%; }
.sp-menu { height: 100vh; height: 100dvh; min-height: 0; overflow: hidden; }
.sp-list { list-style: none; margin: 0; padding: 0 0 4px; display: flex; flex-direction: column; gap: 6px; flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.sp-song { box-sizing: border-box; width: 100%; height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 14px 0 8px; border: 0; border-radius: 16px; background: var(--card); color: var(--text); font: inherit; text-align: left; }
.sp-song:hover { background: color-mix(in srgb, #38bdf8 10%, var(--card)); }
.sp-ic { width: 34px; height: 34px; flex: none; border-radius: 11px; display: grid; place-items: center; background: color-mix(in srgb, #38bdf8 18%, transparent); color: #38bdf8; }
.sp-song.rnd .sp-ic { background: color-mix(in srgb, var(--amber) 18%, transparent); color: var(--amber); }
.sp-song.two { height: 60px; }
.sp-t small { display: block; font-size: 13px; font-weight: 500; color: var(--mute); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; }
.sp-t b { display: block; font-weight: 700; }
.sp-t { flex: 1; min-width: 0; font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp-r { display: flex; align-items: center; color: var(--mute); }
.sp-ok { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--good); color: #06200f; }
.stars.sm i { font-size: 16px; }

/* Die Spur: Titel, Bühne (so groß wie möglich), unten Anhören und die Art */
.sp-play { height: 100vh; height: 100dvh; min-height: 0; overflow: hidden; }
.sp-title { flex: none; text-align: center; font-size: clamp(22px, 6vw, 30px); line-height: 1.1; margin: 4px 0 0; }
.sp-stage { position: relative; flex: 1 1 auto; min-height: 200px; border-radius: 22px; background: radial-gradient(ellipse at 50% 55%, #261e2e, #120f16 72%); overflow: hidden; }
.spur-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.sp-ctrl { flex: none; display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
.sp-click { position: relative; box-sizing: border-box; width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 0; border-radius: 14px; background: var(--card); color: var(--mute); padding: 0; }
.sp-click.on { color: #38bdf8; background: color-mix(in srgb, #38bdf8 18%, var(--card)); }
.sp-click:not(.on)::after { content: ''; position: absolute; left: 11px; right: 11px; top: 50%; height: 3px; border-radius: 2px; background: currentColor; transform: rotate(-40deg); }
.sp-hint { position: absolute; left: 50%; bottom: 5px; transform: translate(-50%, 6px); display: flex; flex-direction: column; align-items: center; gap: 0; padding: 5px 14px; border-radius: 14px; line-height: 1.25; background: rgba(14, 12, 19, .9); border: 1px solid var(--line); font-size: 13px; color: var(--mute); text-align: center; opacity: 0; pointer-events: none; transition: opacity .35s, transform .35s; white-space: nowrap; z-index: 2; }
.sp-hint b { color: var(--text); font-size: 15px; }
.sp-hint.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .sp-hint { transition: none; } }
.sp-listen { min-height: 48px; padding: 0 18px; white-space: nowrap; background: var(--card); color: var(--text); border: 0; }
.sp-mode { padding: 4px; border-radius: 14px; }
.sp-mode button { min-height: 40px; font-size: 15px; padding: 0 8px; }
@media (max-height: 640px) { .sp-page { gap: 8px; } .sp-title { font-size: 22px; } }

/* Einführung (Schritte 7–9) und Lektionen: eine Zeile unter dem Titel; unten nur „Überspringen" */
.sp-sub { flex: none; margin: -6px 0 0; text-align: center; color: var(--mute); font-size: 16px; line-height: 1.3; }
.sp-ctrl.one { display: flex; justify-content: center; align-items: center; min-height: 48px; }
.sp-ctrl .skip { min-height: 48px; padding: 0 22px; }
@media (max-height: 640px) { .sp-sub { font-size: 14px; margin-top: -4px; } }

/* Stimmgerät – eigene Datei, wird von build.mjs nach styles.css und ui/motion.css angehängt.
   Ruhig: ein Punkt auf einer Linie, die Mitte ist das Ziel; ein Wort sagt, was zu tun ist. Unten (im Daumenbereich): welche Saiten schon gestimmt sind.
   Es gibt genau eine Füllung: den Punkt (Flüssigkeit von unten nach oben). Bewegung nur über transform, opacity und stroke-dashoffset:
   Zustände sind übereinanderliegende Ebenen, die per Opacity überblenden. */
.tuner3 { box-sizing: border-box; max-width: 560px; margin: 0 auto; height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: max(16px, env(safe-area-inset-top)) var(--pad) 20px; }
.t3-page { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
.t3-guided { height: 100%; min-height: 0; padding: 0; }
@media (min-width: 900px) { .t3-page { padding-bottom: 24px; } }
.t3-top { display: flex; align-items: center; gap: 12px; }
.t3-top h1 { flex: 1; font-size: clamp(26px, 6vw, 34px); }
.t3-guided .t3-top h1 { font-size: 26px; }

/* Saiten unten, dort reicht der Daumen hin. Nur drei Zustände – offen · dran (türkis) · gestimmt (grün + Haken); nichts füllt sich. Die Ebenen blenden per Opacity um. */
.t3-strings { flex: none; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.t3-str { position: relative; height: 58px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); color: var(--mute); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.t3-str::before, .t3-str::after { content: ''; position: absolute; inset: -2px; border-radius: 16px; border: 2px solid; opacity: 0; transition: opacity var(--t-state) var(--ease-out); pointer-events: none; }
.t3-str::before { border-color: #2dd4bf; background: #0f2a26; }
.t3-str::after { border-color: #2f5a3e; background: #13261f; }
.t3-str.on::before, .t3-str.ok::after { opacity: 1; }
.t3-str > * { position: relative; z-index: 1; }
.t3-str i { display: block; width: 70%; border-radius: 3px; background: #caa36a; }   /* die Saite im Bild: dick bis dünn, immer gleich */
.t3-str b { font-family: var(--display); font-size: 19px; }
.t3-str b::before, .t3-str b::after { content: attr(data-l); position: absolute; inset: 0; opacity: 0; transition: opacity var(--t-state) var(--ease-out); }
.t3-str b::before { color: var(--text); }
.t3-str b::after { color: var(--good); }
.t3-str.on b::before, .t3-str.ok b::after { opacity: 1; }
/* abgehakt: das Häkchen kommt mit einer kleinen Feder (Überschwingen nur hier, ein Erfolgsmoment) */
.t3-str em { position: absolute; z-index: 2; top: -7px; right: -5px; width: 22px; height: 22px; border-radius: 11px; background: var(--good); color: #052e14; display: grid; place-items: center; opacity: 0; transition: opacity var(--t-state) var(--ease-out); }
.t3-str.ok em { opacity: 1; animation: pop var(--t-enter) var(--ease-spring) backwards; }

.t3-stage { flex: 1 1 auto; min-height: 110px; max-height: 320px; border-radius: 22px; background: radial-gradient(ellipse at 50% 55%, #261e2e, #120f16 72%); }
.t3-main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.t3-name { font-family: var(--display); font-weight: 800; font-size: 60px; line-height: 1; min-height: 60px; transition: opacity var(--t-state) var(--ease-out); }
.t3-main.all .t3-name { opacity: 0; }

/* Linie, Ziel (Mitte) und Punkt */
.t3-track { position: relative; width: 100%; max-width: 420px; height: 64px; }
.t3-rail { position: absolute; left: 4%; right: 4%; top: 50%; height: 8px; margin-top: -4px; border-radius: 4px; background: linear-gradient(90deg, #3a2a14, #2a2735 40%, #2a2735 60%, #3a2a14); }
/* viel zu tief / viel zu hoch: der Rand der Linie leuchtet (eigene Ebene, blendet ein) – der Punkt sitzt dort am Rand */
.t3-rail.lo, .t3-rail.hi { opacity: 0; transition: opacity var(--t-state) var(--ease-out); }
.t3-rail.lo { background: linear-gradient(90deg, #a8661a, #2a2735 30%, #2a2735 60%, #3a2a14); }
.t3-rail.hi { background: linear-gradient(90deg, #3a2a14, #2a2735 40%, #2a2735 70%, #a8661a); }
.t3-track.far-lo .t3-rail.lo, .t3-track.far-hi .t3-rail.hi { opacity: 1; }

/* Ziel: nur ein Rahmen, der grün aufleuchtet, wenn der Ton in der Mitte steht – er füllt sich nicht */
.t3-zone { position: absolute; left: 50%; top: 50%; width: 15%; height: 58px; margin: -29px 0 0 -7.5%; border-radius: 18px; }
.t3-zb { position: absolute; inset: 0; border-radius: 18px; border: 2px solid #2f5a3e; }
.t3-zb.hot { border-color: var(--good); opacity: 0; transition: opacity var(--t-state) var(--ease-out); }
.t3-track.in .t3-zb.hot { opacity: 1; }

/* Punkt: oben die Feder (JS verschiebt ihn per transform). Der amberne Punkt füllt sich selbst grün wie Flüssigkeit (die einzige Füllung);
   ist er voll, zeichnet sich der Haken. Die Füllung wächst mit scaleY von unten, der Kreis schneidet sie rund. */
.t3-dot { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; will-change: transform; transition: opacity var(--t-enter) var(--ease-out); }
.t3-dot.dim { opacity: .3; }
.t3-track.done .t3-dot { opacity: 1; }
.t3-core { position: absolute; inset: 4px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 22px rgba(255,181,71,.5); }
.t3-core::after { content: ''; position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 38px rgba(255,181,71,.95); opacity: 0; transition: opacity var(--t-state) var(--ease-out); } /* weit daneben: stärkeres Leuchten (steht, pulsiert nicht) */
.t3-dot.edge .t3-core::after { opacity: 1; }
.t3-liq { position: absolute; inset: 4px; border-radius: 50%; overflow: hidden; }
.t3-liq i { position: absolute; inset: 0; background: var(--good); transform-origin: center bottom; transform: scaleY(0); }
.t3-liq i::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: rgba(255,255,255,.4); }   /* der Flüssigkeitsspiegel */
.t3-tick { position: absolute; inset: 2px; width: auto; height: auto; opacity: 0; transition: opacity var(--t-state) var(--ease-out); }
.t3-tick path { fill: none; stroke: #06240f; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 25; stroke-dashoffset: 25; transition: stroke-dashoffset 0s linear var(--t-state); }
/* der Haken: unsichtbar, bis der Punkt voll ist, dann zeichnet er sich (stroke-dashoffset); beim Zurücksetzen verschwindet er erst, wenn er ausgeblendet ist */
.t3-dot.ok .t3-tick { opacity: 1; }
.t3-dot.ok .t3-tick path { stroke-dashoffset: 0; transition: stroke-dashoffset var(--t-enter) var(--ease-out) 80ms; }

.t3-lo, .t3-hi { position: absolute; bottom: -4px; font-size: 13px; font-weight: 700; color: #6f6880; transition: opacity var(--t-state) var(--ease-out); }
.t3-lo::after, .t3-hi::after { content: attr(data-l); position: absolute; left: 0; top: 0; color: var(--amber); opacity: 0; transition: opacity var(--t-state) var(--ease-out); }
.t3-track.far-lo .t3-lo::after, .t3-track.far-hi .t3-hi::after { opacity: 1; }
.t3-track.done .t3-lo, .t3-track.done .t3-hi { opacity: 0; }
.t3-lo { left: 4%; } .t3-hi { right: 4%; }

/* Wort: Ebenen überblenden (motion.js swapText); jede Ebene trägt ihre Farbe. Zupfen = ruhig grau · Anziehen/Lockern = amber · Halten = türkis · Stimmt = grün */
.t3-say { margin: 0; min-height: 44px; font-family: var(--display); font-weight: 800; font-size: 32px; }
.t3-say .idle { color: var(--mute); }
.t3-say .off { color: var(--amber); }
.t3-say .hold { color: var(--teal, #2dd4bf); }
.t3-say .ok { color: var(--good); }
/* Der Fuß hat immer seine Höhe: wenn „Weiter" erscheint, springt nichts */
.t3-foot { flex: 0 0 auto; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; }
.t3-foot .btn.big { width: 100%; max-width: 420px; }
.t3-next:not([hidden]) { animation: enter var(--t-enter) var(--ease-out) backwards; }
@media (max-height: 700px) { .t3-name { font-size: 44px; min-height: 44px; } .t3-track { height: 52px; } .t3-zone { height: 52px; margin-top: -26px; } .t3-say { font-size: 28px; min-height: 36px; } .t3-str { height: 50px; } .t3-foot { min-height: 46px; } .tuner3 { gap: 10px; } }
</style>
