# iOS-App aus der Web-App bauen und zu TestFlight hochladen – auf einem Mac in der Cloud (GitHub Actions).
# Start: GitHub → Actions → „iOS → TestFlight" → Run workflow. Braucht EIN Geheimnis im Repo (Settings → Secrets → Actions):
#   ASC_KEY_P8 = Inhalt der Datei AuthKey_6RNB25T7XM.p8 (App-Store-Connect-API-Schlüssel „GitHub Riff", Rolle Admin).
# Schlüssel-ID, Issuer-ID und Team-ID sind keine Geheimnisse (nur Namen) – sie stehen deshalb hier offen.
name: iOS → TestFlight
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, die Nutzer sehen (z. B. 1.0)
        default: '1.0'
env:
  TEAM_ID: 543MG4ASG3
  ASC_KEY_ID: 6RNB25T7XM
  ASC_ISSUER_ID: 478e16fc-4df9-4263-a74b-3c894f1c91c6
jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web-App für die App sammeln
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest icon-192.png icon-512.png apple-touch-icon.png www/
          cp -R sounds www/
          if [ -d mascot ]; then cp -R mascot www/; fi
      - name: iOS-Projekt erzeugen und vorbereiten
        run: |
          npm install --no-audit --no-fund
          npx cap add ios --packagemanager SPM
          npx cap sync ios
          python3 ios-ci/prepare.py
      - name: Schlüssel bereitlegen
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          sed "s/__TEAM_ID__/$TEAM_ID/" ios-ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
      - name: Bauen
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Riff.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ inputs.version }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive
      - name: Zu TestFlight hochladen
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Riff.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/out" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Schlüssel löschen
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8"
